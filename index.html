<title>NICU Duty Sheet</title>

<style>
/* ======================================================================
   NICU Duty Sheet – one design system (v56)
   1. tokens  2. base (screen + print)  3. screen  4. print
   Colour rule: white box = you type · teal tint = calculated · red = outside range / act
   ====================================================================== */
:root{
  --bg:#EEF2F4; --panel:#FFFFFF; --sunk:#F5F8F9; --ink:#122229; --muted:#56686F; --line:#DCE3E6; --box:#B6C4C9;
  --accent:#0B6A75; --accent-ink:#07525B; --accent-soft:#E2F0F2; --calc:#E8F3F5;
  --ok:#23784A; --ok-soft:#E3F3EA; --warn:#965A00; --warn-soft:#FCF0D9; --crit:#B3261E; --crit-soft:#FCE6E4; --info:#24589C; --info-soft:#E7EFFA;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:var(--f-body);
  --fs-xs:12.5px; --fs-s:14px; --fs-m:16px; --fs-l:18px; --fs-xl:20px; --fs-2xl:24px;
  --h:46px; --r:10px; --gut:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1316; --panel:#131F24; --sunk:#0F1A1E; --ink:#E6F0F2; --muted:#9BB0B7; --line:#26373D; --box:#3C535B;
  --accent:#62C8D4; --accent-ink:#8ED9E2; --accent-soft:#16343A; --calc:#12313A;
  --ok:#6CCB8F; --ok-soft:#163024; --warn:#F0B44C; --warn-soft:#33270F; --crit:#F2877F; --crit-soft:#3A1A18; --info:#8CB8F5; --info-soft:#17263D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1316; --panel:#131F24; --sunk:#0F1A1E; --ink:#E6F0F2; --muted:#9BB0B7; --line:#26373D; --box:#3C535B;
  --accent:#62C8D4; --accent-ink:#8ED9E2; --accent-soft:#16343A; --calc:#12313A;
  --ok:#6CCB8F; --ok-soft:#163024; --warn:#F0B44C; --warn-soft:#33270F; --crit:#F2877F; --crit-soft:#3A1A18; --info:#8CB8F5; --info-soft:#17263D; color-scheme:dark}

/* ---------- 2. base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
#printout{display:none}

/* ---------- 3. screen ---------- */
@media screen{
body{font-size:var(--fs-m);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
main.wrap{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}

/* top bar */
header.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:var(--fs-xl);letter-spacing:-.01em;margin-right:auto;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:var(--fs-xs);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.shift{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shift input,.shift select{height:40px;border:1px solid var(--box);border-radius:var(--r);padding:0 10px;font-size:var(--fs-s);background:var(--panel)}
#shiftDate.past{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:700}
.beds{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:thin}
.bed{flex:0 0 auto;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:104px;padding:7px 12px 7px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;text-align:left}
.bed::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--sev,var(--line))}
.bed[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.bed i{font-style:normal;font-size:var(--fs-xs);color:var(--muted)}
.bed b{font-size:var(--fs-m)}
.bed span{font-size:var(--fs-xs);color:var(--muted)}
.bed.add{justify-content:center;align-items:center;color:var(--accent-ink);border-style:dashed;font-weight:700}
.bed.add::before,.bed.wp::before{display:none}
.bed.wp{background:var(--sunk)}
.bed.wp i{color:var(--accent-ink);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sep{flex:0 0 1px;background:var(--line);margin-block:6px}
.sev-Stable{--sev:var(--ok)} .sev-Watcher{--sev:var(--warn)} .sev-Unstable{--sev:var(--crit)}
.loc{font-style:normal}

/* banners */
#banners:not(:empty){display:flex;flex-direction:column;gap:6px;padding-top:8px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-radius:var(--r);padding:8px 12px;font-size:var(--fs-s);border:1px solid}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.banner.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.banner .btn{flex:0 0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:var(--r);padding:8px 16px;font-size:var(--fs-s);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--panel);color:var(--accent-ink);border-color:var(--box)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:var(--fs-s)}
.btn.danger{border-color:var(--crit);background:var(--panel);color:var(--crit)}
.btn.danger.arm{background:var(--crit);color:var(--panel)}
.banner.crit .btn{background:var(--crit);border-color:var(--crit)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.linkish{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:8px;height:var(--h);min-width:36px}
.x:hover{background:var(--sunk);color:var(--crit)}
.x.arm{background:var(--crit);color:var(--panel)}
.addrow{align-self:flex-start;border:1px dashed var(--box);background:var(--panel);color:var(--accent-ink);border-radius:var(--r);padding:9px 16px;font-size:var(--fs-s);font-weight:700;cursor:pointer}
.addrow:hover{border-style:solid;border-color:var(--accent)}
.pill{display:inline-block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.sev-Stable{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.sev-Watcher,.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.sev-Unstable{background:var(--crit-soft);color:var(--crit);border-color:transparent}

/* baby summary strip */
.sumbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.sumtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sumloc{font-size:var(--fs-s);font-weight:700;color:var(--muted);letter-spacing:.02em}
.sumbar h1{margin:2px 0 0;font-size:var(--fs-2xl);line-height:1.15;letter-spacing:-.015em}
.summeta{font-size:var(--fs-s);color:var(--muted);margin-top:2px}
.sumright{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:var(--r);padding:8px 12px;min-width:0}
.tile span{display:block;font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tile b{display:block;font-size:var(--fs-l);font-weight:700;overflow-wrap:anywhere}
.reqchip{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:7px 12px;font-size:var(--fs-s);font-weight:600;text-align:left;cursor:pointer}
.sumbar .tools{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.babyhead{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:16px 0 10px}
.babyhead h1{margin:0;font-size:var(--fs-2xl);letter-spacing:-.015em}
.babyhead .meta{font-size:var(--fs-s);color:var(--muted)}
.babyhead .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.empty-state{text-align:center;padding:64px 16px}.empty-state h1{font-size:var(--fs-2xl);margin:0 0 6px}.empty-state p{color:var(--muted);margin:0 0 16px}

/* tabs + section jump (sticky under the top bar) */
.stick{position:sticky;top:var(--hdrH,0px);z-index:5;background:var(--bg);padding-top:10px;box-shadow:0 8px 8px -10px rgba(0,0,0,.3)}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:9px 14px;font-size:var(--fs-m);font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:42px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.jump{display:flex;flex-wrap:wrap;gap:6px;overflow-x:visible;padding:8px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px 6px 6px;font-size:var(--fs-s);font-weight:600;cursor:pointer;white-space:nowrap}
.jump button:hover{border-color:var(--accent)}
.jump button b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:var(--fs-xs);margin-right:6px}

/* section cards */
.cols{display:block;counter-reset:sec}
.offtab{display:none!important}
section.card{counter-increment:sec;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;scroll-margin-top:calc(var(--hdrH,0px) + 120px);overflow:clip}
section.card>h2{margin:0;padding:12px var(--gut);font-size:var(--fs-xl);font-weight:700;letter-spacing:-.005em;border-bottom:1px solid var(--line)}
section.card>h2 .fold{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:34px}
section.card>h2 .fold::before{content:counter(sec);flex:0 0 30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);font-size:var(--fs-s);font-weight:800}
section.card>h2 .fold::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-3px,-3px);margin-left:auto;margin-right:6px;flex:0 0 auto;transition:transform .15s}
section.card.folded>h2{border-bottom:0}
section.card.folded>h2 .fold::after{transform:rotate(-45deg)}
section.card.folded>:not(h2){display:none!important}
.lastchg{margin:0;padding:8px var(--gut);background:var(--sunk);border-bottom:1px solid var(--line);font-size:var(--fs-s);color:var(--ink)}
.lastchg span{font-size:var(--fs-xs);font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.lastchg .linkish{margin-left:8px;font-size:var(--fs-xs)}

/* field grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 16px;padding:16px var(--gut) 18px;align-items:end}
.sub{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:var(--fs-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.sub::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.grid>.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld.span2{grid-column:span 2}
.fld label,.fld .lbl{font-size:var(--fs-s);font-weight:600;color:var(--ink);line-height:1.25}
.unit{font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.req{color:var(--crit);font-weight:800;margin-left:2px}
.fmsg{font-size:var(--fs-xs);font-weight:600;color:var(--crit);line-height:1.3}
.frow:not(:has(>:not([hidden]))){display:none}
.frow{grid-column:1/-1;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.frow>.fld{flex:var(--g,1) 1 0;min-width:var(--mw,76px)}
.frow>.fld:has(.t24w){flex:0 0 auto;min-width:max-content}
.frow>.fld:not(:has(.para)):not(:has(textarea)):not(:has(.nu)){max-width:460px}
.grid>.fld:has(>.t24w>.dm),.grid>.fld:has(>.t24w>input[type=date]){grid-column:span 2;min-width:max-content}
.mini{display:flex;flex-direction:column;gap:5px;font-size:var(--fs-s);font-weight:600;color:var(--muted);min-width:0}
.hint{font-size:var(--fs-s);line-height:1.45;color:var(--muted);padding:0 var(--gut);margin:0 0 8px}
.fld .hint,.fld .list,.fld .tblbar,.fld .log{padding-left:0;padding-right:0}

/* boxes you type in */
.inp{width:100%;min-width:0;height:var(--h);min-height:var(--h);background:var(--panel);border:1px solid var(--box);border-radius:var(--r);padding:0 12px;font-size:17px;color:var(--ink);line-height:1.2;transition:border-color .12s,box-shadow .12s}
.inp{font-weight:700}.inp::placeholder{font-weight:400;color:color-mix(in srgb,var(--muted) 75%,transparent)}
.inp:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--box))}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.bad,.inp.oor{border-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
select.inp{-webkit-appearance:none;appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 12px) 52%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;text-overflow:ellipsis}
input.inp[type=number]{font-weight:700;font-size:19px;text-align:center;-moz-appearance:textfield}
input.inp[type=number]::-webkit-inner-spin-button,input.inp[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.inp[type=date],input.inp[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;padding:0 10px;font-weight:700;text-align:center;line-height:calc(var(--h) - 2px)}
input.inp[type=date]::-webkit-date-and-time-value{text-align:center;margin:0}
textarea.inp{height:auto;min-height:var(--h);padding:11px 12px;line-height:1.4;resize:none;overflow-y:hidden;field-sizing:content}
#hoText{height:220px;min-height:220px;overflow-y:auto;resize:vertical;font:15px/1.5 var(--f-body);margin:0 12px 12px;width:calc(100% - 24px)}
#f_floor,#f_station,#f_bedno{font-weight:800}

/* calculated boxes – one look everywhere */
.calc{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:var(--h);background:var(--calc);border-radius:var(--r);border-left:4px solid var(--accent);padding:8px 12px;font-size:17px;font-weight:700;color:var(--accent-ink);line-height:1.35}
.calc small{font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.calc.empty{font-size:var(--fs-s);font-weight:500;color:var(--muted);border-left-color:var(--box);background:var(--sunk)}
.calc.warnc{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn)}
.calc .btn{min-height:32px;padding:4px 10px;font-size:var(--fs-xs)}
.autob{padding-top:12px!important}
.autob .calc{display:block}
.oxchip{display:inline-block;padding:2px 10px;border-radius:8px;background:var(--panel);color:var(--accent-ink);border:1px solid var(--accent);font-weight:800;line-height:1.5}
.oxchip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.oxchip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.oxchip.hi{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.oxband{color:var(--crit)}
.calc .vchips,.calc .cbul,.calc .vhead{flex-basis:100%}
.vhead{font-size:var(--fs-xs);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 0 4px}
.vhead:not(:first-child){margin-top:10px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{display:inline-flex;flex-direction:column;justify-content:center;min-width:76px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 10px 8px;line-height:1.3}
.vchip small{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:none}
.vchip b{font-size:18px;font-weight:800;color:var(--ink)}.vchip b i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted)}
.vchip.calc{background:var(--calc);border-color:color-mix(in srgb,var(--accent) 35%,transparent);border-left:1px solid color-mix(in srgb,var(--accent) 35%,transparent);min-height:0;padding:5px 10px 8px;display:inline-flex}
.vchip.calc b{color:var(--accent-ink)}
.vchip.hi{background:var(--crit-soft);border-color:var(--crit)}.vchip.hi b,.vchip.hi small{color:var(--crit)}
.cbul{margin:2px 0 0;padding-left:20px;font-size:15px;font-weight:500;color:var(--ink);line-height:1.45}
.cbul li{margin:2px 0}.cbul li::marker{color:var(--accent)}
.cbul small{font-size:var(--fs-xs)}

/* GA, para, time and number groups */
.para{display:flex;align-items:center;gap:6px;font-weight:700;flex-wrap:nowrap}
.para .inp{flex:none;width:3.2em;padding:0 4px;text-align:center;font-weight:700}
.para.gab .inp{width:4em;font-size:22px}
.para select.inp,.para .pg{flex:none;width:4.4em;padding:0 20px 0 8px;text-align:left;background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%}
.pbox{display:contents}
.t24w{display:flex;gap:6px;flex-wrap:nowrap;width:100%;min-width:0}
.t24w>.inp{flex-shrink:0}
.t24w input[type=date]{flex:0 0 172px;width:172px}
.t24w .dm{flex:0 0 80px;width:80px;padding:0 4px;text-align:center;font-weight:700;font-size:19px}
.t24w .t24{flex:0 0 88px;width:88px;padding:0 4px;text-align:center;font-weight:700;font-size:19px}
.t24w .ap{flex:0 0 78px;width:78px;padding:0 22px 0 10px;font-weight:600;background-position:calc(100% - 14px) 52%,calc(100% - 8px) 52%}
.nu{display:flex;align-items:center;gap:8px}.nu .inp{flex:1 1 auto;min-width:90px}.nu .unit{white-space:nowrap;font-size:var(--fs-s);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--box);background:var(--panel);border-radius:99px;padding:10px 20px;cursor:pointer;font-size:var(--fs-m);font-weight:600;min-height:44px}
.seg button[aria-pressed="true"].s-Stable{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:800}
.seg button[aria-pressed="true"].s-Watcher{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:800}
.seg button[aria-pressed="true"].s-Unstable{background:var(--crit-soft);border-color:var(--crit);color:var(--crit);font-weight:800}

/* inotropes: each drug in its own panel */
.frow:has(>.inoch){gap:12px 14px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.frow:has(>.inoch)>.fld{flex:1 1 200px;min-width:180px}
.frow:has(>.inoch)>.fld:has(.t24w){flex:0 0 auto;min-width:max-content}
.frow:has(>.inoch)>.fld:has(.nu){flex:0 1 240px;min-width:200px}
.inoch{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end;flex:1 1 calc(100% - 110px);min-width:0;border-top:1px dashed var(--box);padding-top:12px}
.inoch .fld{flex:0 1 auto;min-width:0}.inoch .fld:has(.nu){flex:0 1 240px}.inoch .fld.b{flex:0 0 auto}
.frow:has(>.inoch)>.fld:has(.dcb){flex:0 0 auto;min-width:0;border-top:1px dashed var(--box);padding-top:12px}
.dcb{min-height:var(--h);min-width:72px;font-size:var(--fs-m);font-weight:800}

/* lists of rows (medicines, lines, cultures, BP…) */
.list{display:flex;flex-direction:column;gap:10px;padding:4px var(--gut) 16px}
.row{display:grid;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.row .res{grid-column:1/-1}
.row .day{font-size:var(--fs-s);font-weight:800;color:var(--accent-ink);background:var(--calc);border-radius:8px;padding:12px 4px;text-align:center}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);margin:0}
.row.dated{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 72px 76px 40px;align-items:center}
.row.prev{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 40px}
.row.img{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 40px}
.row.todo{grid-template-columns:30px 120px minmax(0,1fr) 40px;align-items:center;padding:8px 10px}
.row.todo.done .inp{text-decoration:line-through;color:var(--muted)}
.row.todo textarea.inp{text-align:left}
.row.abc{grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) 40px}
.row.line{grid-template-columns:minmax(130px,1fr) max-content max-content 110px 40px}
.row.line .calc{white-space:nowrap}
.row.tx{grid-template-columns:minmax(0,1.3fr) 64px max-content 90px 110px 40px}
.calc.txn{justify-content:center;font-weight:800}
.row.cult{grid-template-columns:minmax(110px,1fr) max-content minmax(150px,2fr) minmax(150px,1.2fr) 40px}
.row.nbs{grid-template-columns:minmax(120px,1.3fr) max-content minmax(150px,1.4fr) 40px}
.row.metinv{grid-template-columns:minmax(0,2fr) minmax(160px,1fr) 40px}
.row.ctemp{grid-template-columns:max-content minmax(110px,160px) 40px}
.row.med{display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.row.med .l1{display:grid;grid-template-columns:minmax(160px,1fr) max-content 76px 76px 40px;gap:10px;align-items:center;width:100%}
.row.med .l2{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;width:100%}
.row.med .l2 .inp{width:auto;min-width:0}
.row.med input[data-p=ds]{width:96px}
.row.med .strw{display:flex;gap:6px;align-items:center}.row.med input[data-p=cs]{width:120px}
.row.med .mcw{white-space:nowrap}.row.med .mcw .mwt{font-weight:500}
.row.med .mcw .mcalc{justify-content:center;white-space:nowrap;font-size:var(--fs-m)}
.row.med .mcw[hidden]{display:none}
.row.med .mhint{font-size:var(--fs-xs);color:var(--muted);width:100%}
/* blood pressure: date line, readings, normal-range boxes under them */
.row.bpr{grid-template-columns:minmax(190px,1.15fr) repeat(3,minmax(88px,1fr)) 40px;row-gap:10px}
.row.bpr>label.nm{grid-column:1/-1;grid-row:1;justify-self:start}
.row.bpr>label:nth-of-type(2){grid-column:2;grid-row:2}.row.bpr>label:nth-of-type(3){grid-column:3;grid-row:2}.row.bpr>label:nth-of-type(4){grid-column:4;grid-row:2}
.row.bpr>.x{grid-column:5;grid-row:2}
.row.bpr [data-bpref]{display:contents}
.row.bpr .bplab{grid-column:1;grid-row:2/4}
.row.bpr [data-bpref]>div:nth-of-type(2){grid-column:2;grid-row:3}.row.bpr [data-bpref]>div:nth-of-type(3){grid-column:3;grid-row:3}.row.bpr [data-bpref]>div:nth-of-type(4){grid-column:4;grid-row:3}
.row.bpr>.res{grid-row:4}
.bpnow{display:grid;grid-template-columns:minmax(190px,1.15fr) repeat(3,minmax(88px,1fr));gap:10px;align-items:end;margin-bottom:10px;padding:10px;border:2px solid color-mix(in srgb,var(--sc,var(--accent)) 45%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--sc,var(--accent)) 5%,var(--panel))}
.bpnow .bplab{align-self:stretch}.bpnow>.calc{grid-column:1/-1}
details.bpold{border:1px dashed var(--box);border-radius:12px;padding:8px 10px;margin-bottom:10px}details.bpold>summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:var(--fs-s)}details.bpold[open]>summary{margin-bottom:10px}details.bpold .row{margin-bottom:10px}
.wold{color:var(--warn)}
.bed .bnm{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.jump button.chg{position:relative;border-color:var(--sc);background:color-mix(in srgb,var(--sc) 8%,var(--panel))}
.jump button.chg::after{content:"";position:absolute;top:2px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}
.fld.stale .inp{border-color:var(--warn);background:var(--warn-soft)}
.oldtag{margin-left:6px;font-size:var(--fs-xs);font-weight:800;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;text-transform:uppercase;letter-spacing:.03em}
.tstrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 4px;padding:10px 12px;background:color-mix(in srgb,#3B48AA 7%,var(--panel));border:1px solid color-mix(in srgb,#3B48AA 30%,var(--line));border-left:4px solid #3B48AA;border-radius:12px}
.tstrip[hidden]{display:none}
.tstrip .tsh{font-weight:800;color:#3B48AA;font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.tstrip .tsh b{background:#3B48AA;color:#fff;border-radius:99px;padding:0 8px;margin-left:4px}
.tstrip .tsk{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer}
.tstrip .tsk input{width:20px;height:20px}.tstrip .tsk i{font-style:normal;font-weight:600;color:var(--muted);font-size:var(--fs-s)}
#CALC_wage{font-size:20px}
@media (max-width:700px){#CALC_curm{font-size:var(--fs-s)}}#CALC_curm .curm{white-space:nowrap}#CALC_curm .btn{flex:0 0 auto}
.bplab{display:flex;flex-direction:column;justify-content:center;gap:4px;align-self:stretch;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.3}
.bpt1{font-size:var(--fs-m);font-weight:800}.bpt1 span{font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.bpchips{display:flex;flex-wrap:wrap;gap:6px}
.bpchips span{background:var(--panel);border:1px solid var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 10px;font-size:var(--fs-s);font-weight:600}
.bpsrc{font-size:var(--fs-xs);color:var(--muted)}.bpsrc b{color:var(--ink)}
.bplim{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;align-content:center;gap:6px;min-height:var(--h);border:1px dashed var(--box);border-radius:var(--r);padding:6px;background:var(--sunk)}
.bplim .lo,.bplim .hi{font-size:var(--fs-l);font-weight:800}.bplim .dash{color:var(--muted)}
.bplim em{flex-basis:100%;text-align:center;font-style:normal;font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.bplim.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.bplim.low,.bplim.high{border-style:solid;border-color:var(--crit);background:var(--crit-soft)}
.bplim.low em,.bplim.high em,.bplim.low .lo,.bplim.high .hi{color:var(--crit)}

/* tables (blood gases, labs, scores, echo) */
.tblbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px var(--gut) 8px}
.tblbar .sub{border:0;padding:0;margin:0}
.tblwrap{overflow-x:auto;margin:0 var(--gut) 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:var(--fs-s)}
table.sheet th,table.sheet td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.sheet th+th,table.sheet td+td{border-left:1px solid var(--line)}
table.sheet.gas th+th,table.sheet.gas td+td{border-left:2px solid var(--line)}
table.sheet tr:last-child>*{border-bottom:0}
table.sheet thead th{background:var(--sunk);font-weight:700;padding:8px 6px}
table.sheet thead th:not(:first-child){text-align:center}
table.sheet thead th:first-child,table.sheet tbody th{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;font-weight:700;padding:6px 14px;white-space:nowrap;min-width:110px;border-right:1px solid var(--line)}
table.sheet thead th:first-child{z-index:2;background:var(--sunk)}
table.sheet tr.grp th,table.sheet tr.grp td{background:var(--sunk);font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.sheet td{text-align:center}
table.sheet .inp{width:108px;height:44px;min-height:44px;padding:0 8px;font-size:18px;font-weight:700;text-align:center;margin-inline:auto;display:block}
table.sheet select.inp{font-size:var(--fs-m);font-weight:600;text-align-last:center;padding-right:26px;background-position:calc(100% - 14px) 52%,calc(100% - 8px) 52%}
table.sheet td>textarea.inp{text-align:left;font-weight:500;font-size:var(--fs-m)}
.sheet th small.nr{display:block;font-size:var(--fs-xs);font-weight:500;color:var(--muted);white-space:normal}
td.tt{background:var(--calc);color:var(--accent-ink);font-weight:800;font-size:var(--fs-m);padding:4px 10px;white-space:nowrap}
table.sheet.echo td.tt{white-space:normal;text-align:left;min-width:120px}
table.sheet.echo th:first-child{width:44%;min-width:150px;max-width:46vw;white-space:normal}
table.sheet.echo td{min-width:120px}table.sheet.echo td select.inp,table.sheet.echo td textarea.inp{width:100%;min-width:12.5em}
table.sheet.wsel td{min-width:16em}table.sheet.wsel td select.inp{width:100%;min-width:15em;font-size:var(--fs-s);text-align-last:left}
table.sheet.bgt .inp{width:84px}
table.sheet.ref td{padding:7px 12px;font-size:var(--fs-s)}
table.sheet.ref tr.on>*{background:var(--accent-soft);color:var(--accent-ink)}
table.bpt td,table.bpt th{padding:4px 8px}
.colh{display:flex;align-items:center;justify-content:center;gap:2px}.colh .inp{width:100px}
.colt{display:flex;flex-direction:column;gap:4px;width:178px}.colt .t24w{width:100%}
.colt span.t24w:first-of-type .dm{flex:1 1 auto;width:100%}
th.xrow .inp{width:100%;min-width:0;font-weight:700;text-align:left}
.colh .x{height:32px;min-width:28px;font-size:18px}
.nocol{padding:12px 14px;color:var(--muted);font-size:var(--fs-s);font-weight:500;white-space:normal;min-width:180px;text-align:left}
.under{padding:0 var(--gut) 14px;margin-top:-6px}
/* v61: "+" buttons for folded groups, time-of-change bar, lab flags */
.revbar,.fld.revbar{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center}
.under.revbar{padding-top:14px;margin-top:0}
.revbar .addrow[hidden],.revbar[hidden]{display:none}
.sub small,.lbl small{text-transform:none;letter-spacing:0;font-weight:600;font-size:var(--fs-xs)}
.chtbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;padding:10px var(--gut);border-bottom:1px solid var(--line);background:var(--sunk)}
.chtbar .mini{flex:0 0 auto}
.chtbar .chtn{flex:1 1 220px;font-size:var(--fs-xs);color:var(--muted);padding-bottom:10px}
.chtbar.on{background:var(--warn-soft)}.chtbar.on .chtn{color:var(--warn);font-size:var(--fs-s)}
.chtbar .linkish{margin-left:6px;font-size:var(--fs-xs)}
.vchip.oxneed{border-style:dashed;background:var(--sunk)}.vchip.oxneed b{font-size:12.5px}.vchip.oxneed b i{font-size:12.5px}
.labhi{color:var(--crit)}
.agneed{color:var(--muted);font-size:var(--fs-xs)}
.calc .curmedit{align-self:center;margin-left:4px}
.hideempty .chtbar,.hideempty .revbar{display:none!important}
details.calcref,details.echofold{margin:4px var(--gut) 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.fld details.calcref{margin-left:0;margin-right:0}
details.calcref>summary,details.echofold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;font-size:var(--fs-s);font-weight:700;color:var(--accent-ink)}
details.calcref>summary::-webkit-details-marker,details.echofold>summary::-webkit-details-marker{display:none}
details.calcref>summary::after,details.echofold>summary::after{content:"Show ▸";font-size:var(--fs-xs);font-weight:500;color:var(--accent-ink);white-space:nowrap}
details.calcref[open]>summary::after,details.echofold[open]>summary::after{content:"Hide ▾"}
details.echofold>summary span{font-weight:500;color:var(--muted);font-size:var(--fs-xs);white-space:nowrap;margin-left:auto}
details.echofold>.tblbar>.sub{display:none}
details.calcref .tblwrap{margin:0 12px 10px}details.calcref .hint{padding:0 14px}
details.coolchk>summary{color:var(--crit)}
details.coolchk .calc.ce{display:block;line-height:1.6}

/* logs and auto lists */
.log{list-style:none;margin:0;padding:2px var(--gut) 12px;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:52px 180px minmax(0,1fr) 40px;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:6px 10px;font-size:var(--fs-m)}
.log li .ld{font-size:var(--fs-s);font-weight:700;color:var(--accent-ink)}
.log li .inp{height:40px;min-height:40px;font-size:var(--fs-m);font-weight:600}
.log li .x{height:40px}
.log li.empty{display:block;background:none;padding:2px 0;color:var(--muted);font-size:var(--fs-s)}
.auto{list-style:none;margin:0;padding:4px var(--gut) 12px;display:flex;flex-direction:column;gap:8px}
.auto li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.auto li b{font-weight:500}.auto li b em{font-style:normal;font-weight:800;font-size:var(--fs-s);color:var(--accent-ink);margin-left:8px}
.auto li small{font-size:var(--fs-xs);color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.auto li.txc{grid-template-columns:minmax(0,1fr) 64px auto}
.auto li.txc .cnt{justify-content:center;font-weight:800;min-height:36px}
.auto li.empty{display:block;background:none;border:0;color:var(--muted);font-size:var(--fs-s);padding:0}

/* handover */
.ho{padding:12px var(--gut) 18px;display:flex;flex-direction:column;gap:12px}
.ho .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.sbar{display:flex;flex-direction:column;gap:10px}
.sbhead{font-size:1.45rem;font-weight:800}
.sb{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px 12px;background:var(--sunk)}
.sb-S{border-left-color:var(--warn)}.sb-B{border-left-color:var(--info)}.sb-A{border-left-color:var(--accent)}.sb-R{border-left-color:var(--crit)}
.sb header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sb header b{font-size:19px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-right:auto}
.sbl{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--panel);font-weight:800}
.sb .hl{position:relative;padding:4px 0 4px 16px;font-size:19px;line-height:1.5;overflow-wrap:anywhere}
.sb .hl::before{content:"•";position:absolute;left:2px;color:var(--accent);font-weight:800}
.sb .hl.ind{padding-left:34px;font-size:18px}.sb .hl.ind::before{content:"–";left:18px;font-weight:400}
.sb .hl.ind.box::before,.sb .hl.empty::before{content:""}
.sb .hl.empty{color:var(--muted)}
.sb .hl.chg{color:var(--muted);font-size:17px}
.sb .hl.hk2{display:grid;grid-template-columns:minmax(100px,160px) 1fr;gap:2px 10px;align-items:start;padding:5px 0 5px 14px;border-bottom:1px dashed var(--line)}
.sb .hl.hk2:last-child{border-bottom:0}
.sb .hk{font-weight:800;color:var(--accent-ink);font-size:17px;padding-top:2px}
.sb .hv{display:flex;flex-wrap:wrap;gap:4px 5px;min-width:0}
.sb .hchip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:1px 8px;font-size:18px;line-height:1.5}
.sb b.n{font-weight:800;margin:0}

/* station work plan */
.wpgrid{display:grid;grid-template-columns:1fr;gap:18px}
.wpc{--wfs:20px;background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--sev,var(--box));border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wpc .wphead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 12px;background:color-mix(in srgb,var(--sev,var(--box)) 9%,var(--panel));border-bottom:1px solid var(--line)}
.wpname{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.wpname i{font-style:normal;font-size:var(--fs-s);font-weight:700;color:var(--muted)}
.wpname b{font-size:26px;font-weight:800;color:var(--ink)}
.wpname .miss{color:var(--crit);font-weight:800}
.wptiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:14px 18px 4px}
.wptiles div{background:var(--sunk);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.wptiles span{font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wptiles b{font-size:26px;font-weight:800;line-height:1.2}
.wpc dl{margin:0;padding:8px 18px 12px;display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:16px}
.wpc dt,.wpc dd{padding:10px 0;border-bottom:1px solid var(--line)}
.wpc dl>dt:last-of-type,.wpc dl>dd:last-of-type{border-bottom:0}
.wpc dt{font-size:var(--fs-s);font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:13px}
.wpc dd{margin:0;min-width:0;overflow-wrap:anywhere;font-size:var(--wfs);line-height:1.45}
.wpc dd.key{font-weight:800}
.wpc dd.flag{color:var(--crit);font-weight:700}
.wpb{margin:0;padding-left:18px}.wpb li{margin:2px 0}
.chg{color:var(--accent-ink);font-size:var(--fs-m)}
.wpc dd.flag .chg{color:var(--accent-ink)}
.wpfam{display:flex;justify-content:flex-end;padding:4px 18px 10px}
.wptodo{margin:0 18px 18px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.wptodo .ttl{font-size:var(--fs-s);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wptodo label{display:grid;grid-template-columns:28px 90px minmax(0,1fr);gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:var(--fs-l);cursor:pointer}
.wptodo label input{width:24px;height:24px;accent-color:var(--accent);margin:0}
.wptodo label .tm{font-weight:800;color:var(--accent-ink)}
.wptodo label.done{opacity:.6}.wptodo label.done span:last-child{text-decoration:line-through}
.wpadd{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px}

/* overlays */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.undo{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
.undo.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.undo button{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:7px 16px;font-weight:800;cursor:pointer}
.pwdlg,#prfb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.pwdlg form,#prfb .prbox{background:var(--panel);color:var(--ink);border-radius:16px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.pwdlg b{font-size:var(--fs-l)}.pwdlg p{margin:0;font-size:var(--fs-s);color:var(--muted)}
.pwdlg .rem{display:flex;gap:8px;align-items:center;font-size:var(--fs-s)}.pwdlg .rem input{width:20px;height:20px;accent-color:var(--accent)}
.pwdlg .err{color:var(--crit);font-size:var(--fs-s);min-height:1em}.pwdlg .btns{justify-content:flex-end}
#prfb h3{margin:0;font-size:var(--fs-l)}#prfb ul{padding-left:18px;margin:4px 0}#prfb li{margin:4px 0;font-size:15px}
#prfb .prbtns{display:flex;flex-wrap:wrap;gap:8px}
.prwarn{margin:0;background:var(--crit-soft);color:var(--crit);border-radius:var(--r);padding:8px 12px;font-size:var(--fs-s)}
#acbox{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--box);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);overflow-y:auto;max-height:260px}
#acbox button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;font-size:var(--fs-m);cursor:pointer;color:var(--ink)}
#acbox button:hover,#acbox button.on{background:var(--accent-soft)}
.foot{font-size:var(--fs-xs);color:var(--muted);margin-top:18px;max-width:70ch}

/* ---------- colour identity: each body system has its own colour (headers, chips, sub-headings, work plan).
   Status colours stay reserved: red = out of range / act, amber = warning, teal tint = calculated. ---------- */
#sec-patient,[data-jump=patient],#sec-status,[data-jump=status],#sec-handover,[data-jump=handover],#sec-backup,[data-jump=backup]{--sc0:#0B6A75}
#sec-weight,[data-jump=weight]{--sc0:#2E7D32}
#sec-antenatal,[data-jump=antenatal]{--sc0:#A3367E}
#sec-birth,[data-jump=birth]{--sc0:#A35F00}
#sec-referral,[data-jump=referral]{--sc0:#6B4BA8}
.rfline{margin:0;padding:8px var(--gut);background:color-mix(in srgb,#6B4BA8 8%,var(--panel));border-bottom:1px solid var(--line);font-size:var(--fs-s);display:flex;flex-wrap:wrap;gap:5px 6px;align-items:baseline}
.rfline b.t{font-size:var(--fs-xs);letter-spacing:.05em;text-transform:uppercase;color:#6B4BA8;margin-right:4px}
.rfline span{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:1px 8px;font-weight:600}
.rftag{color:#6B4BA8!important;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rfline b.t,:root:not([data-theme="light"]) .rftag{color:#B9A2EE!important}}
#sec-respiratory,[data-jump=respiratory],#sec-blood,[data-jump=blood],#sec-hresp,[data-jump=hresp]{--sc0:#1F5FB8}
#sec-cardiovascular,[data-jump=cardiovascular],#sec-echo,[data-jump=echo],#sec-hcvs,[data-jump=hcvs]{--sc0:#A3245A}
#sec-fluids,[data-jump=fluids],#sec-hfluids,[data-jump=hfluids]{--sc0:#0A7896}
#sec-abdomen,[data-jump=abdomen],#sec-habd,[data-jump=habd]{--sc0:#B0541B}
#sec-neuro,[data-jump=neuro],#sec-hneuro,[data-jump=hneuro]{--sc0:#6343B8}
#sec-infection,[data-jump=infection],#sec-hinf,[data-jump=hinf]{--sc0:#5B7A10}
#sec-lines,[data-jump=lines],#sec-hlines,[data-jump=hlines]{--sc0:#4B5E70}
#sec-current,[data-jump=current],#sec-previous,[data-jump=previous]{--sc0:#1C7A4B}
#sec-jaundice,[data-jump=jaundice],#sec-hjaun,[data-jump=hjaun]{--sc0:#946F00}
#sec-plan,[data-jump=plan],#sec-consultations,[data-jump=consultations]{--sc0:#3B48AA}
#sec-investigations,[data-jump=investigations],#sec-imaging,[data-jump=imaging]{--sc0:#0E7A6A}
#sec-transfusions,[data-jump=transfusions]{--sc0:#8F2F46}
#sec-newborn,[data-jump=newborn],#sec-hrop,[data-jump=hrop],#sec-rop,[data-jump=rop]{--sc0:#7A3E9C}
section.card,.jump button{--sc:var(--sc0,var(--accent));--scs:color-mix(in srgb,var(--sc) 10%,var(--panel))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section.card,:root:not([data-theme="light"]) .jump button{--sc:color-mix(in srgb,var(--sc0,#62C8D4) 55%,#fff);--scs:color-mix(in srgb,var(--sc0,#62C8D4) 22%,var(--panel))}}
section.card{border-top:4px solid var(--sc)}
section.card>h2{background:var(--scs);color:var(--sc);border-bottom-color:color-mix(in srgb,var(--sc) 22%,var(--line))}
section.card>h2 .fold::before{background:var(--sc);color:var(--panel)}
section.card>h2 .fold::after{border-color:var(--sc)}
section.card .sub{color:var(--sc)}
section.card .sub::before{background:var(--sc)}
section.card .lastchg{background:color-mix(in srgb,var(--sc) 5%,var(--panel))}
section.card .lastchg span{color:var(--sc)}
.jump button b{background:var(--sc);color:var(--panel)}
.jump button:hover{border-color:var(--sc);color:var(--sc)}
.tabs button[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--accent),0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line);color:var(--accent-ink)}
.brand::before{content:"";display:inline-block;width:12px;height:22px;margin-right:8px;vertical-align:-3px;border-radius:3px;background:linear-gradient(var(--accent) 0 33%,#1F5FB8 33% 66%,#6343B8 66%)}
/* summary tiles: soft colour per measure */
.tile{border-top:3px solid var(--tc,var(--line));background:color-mix(in srgb,var(--tc,var(--line)) 8%,var(--panel))}
.tile span{color:var(--tc,var(--muted))}
.tile:nth-child(1){--tc:#1F5FB8}.tile:nth-child(2){--tc:#6343B8}.tile:nth-child(3){--tc:#0B6A75}.tile:nth-child(4){--tc:#1C7A4B}.tile:nth-child(5){--tc:#0A7896}
.wptiles div{border-top:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 8%,var(--panel))}.wptiles span{color:var(--tc)}
.wptiles div:nth-child(1){--tc:#1F5FB8}.wptiles div:nth-child(2){--tc:#6343B8}.wptiles div:nth-child(3){--tc:#0B6A75}.wptiles div:nth-child(4){--tc:#1C7A4B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile span{color:color-mix(in srgb,var(--tc) 55%,#fff)}}
/* station work plan: category colours */
.wpc dt{color:var(--dc,var(--muted))}
.wpc dt::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--dc,var(--line));margin-right:7px;vertical-align:0}
.wpc dt[data-c=born],.wpc dt[data-c=admitted],.wpc dt[data-c=age],.wpc dt[data-c=weight]{--dc:#0B6A75}
.wpc dt[data-c=dx],.wpc dt[data-c=problems]{--dc:#A3367E}
.wpc dt[data-c=resp]{--dc:#1F5FB8}
.wpc dt[data-c=cvs]{--dc:#A3245A}
.wpc dt[data-c=fluids]{--dc:#0A7896}
.wpc dt[data-c=abdomen]{--dc:#B0541B}
.wpc dt[data-c=neuro]{--dc:#6343B8}

<body>

<header class="top"><div class="wrap">
  <div class="toprow">
    <div class="brand">NICU Duty Sheet<small>Per-baby follow-up</small></div>
    <div class="shift">
      <select id="floorFilter" aria-label="Show floor"><option value="">All floors</option><option>C3</option><option>C4</option><option>C6</option><option>C7</option></select>
      <input type="date" id="shiftDate" aria-label="Shift date">
      <button type="button" class="btn ghost sm" data-act="backup" title="Share all babies to your other device (AirDrop)">⇪ Send</button>
      <label class="btn ghost sm" for="restoreIn" title="Open a file sent from your other device">⇩ Receive</label>
      <input type="file" id="restoreIn" accept="application/json,.json" hidden>
    </div>
  </div>
  <div class="beds" id="beds" role="tablist" aria-label="Babies and work plans"></div>
  <div id="banners"></div>
</div></header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status"></div>

<datalist id="nbsabn"><option>TSH high – congenital hypothyroidism</option><option>17-OHP high – CAH</option><option>Phenylalanine high – PKU</option><option>Leucine high – MSUD</option><option>Tyrosine high – tyrosinaemia</option><option>Citrulline / urea cycle disorder</option><option>Galactosaemia (GALT low)</option><option>Biotinidase deficiency</option><option>C8 high – MCAD deficiency</option><option>Long-chain FAOD (LCHAD / VLCAD)</option><option>Organic acidaemia (PA / MMA / IVA)</option><option>Glutaric aciduria type 1</option><option>IRT high – cystic fibrosis</option><option>Haemoglobinopathy (sickle / thalassaemia)</option><option>G6PD deficiency</option><option>SCID (TREC low)</option><option>SMA</option></datalist>
<datalist id="iemdx"><option>Urea cycle disorder</option><option>Organic acidaemia</option><option>MSUD</option><option>Fatty acid oxidation defect</option><option>Mitochondrial disorder</option><option>Galactosaemia</option><option>Hyperinsulinism</option><option>Glycogen storage disease</option><option>Non-ketotic hyperglycinaemia</option><option>Pyridoxine-dependent epilepsy</option><option>Peroxisomal disorder</option><option>Congenital adrenal hyperplasia</option><option>Congenital hypothyroidism</option></datalist>

<datalist id="dccwhy"><option>Baby not vigorous – needed immediate resuscitation (NRP)</option><option>Apnoea / poor tone at birth</option><option>Maternal haemorrhage / haemodynamic instability</option><option>Placental abruption</option><option>Placenta praevia / incision through placenta</option><option>Cord avulsion / snapped cord</option><option>Short cord / cord not intact</option><option>Monochorionic twins</option><option>Hydrops / suspected severe anaemia</option><option>Not considered / indicated but not done</option><option>Staff / setting constraint</option><option>Parental request</option></datalist>

<script>
(function(){
const KEY="nicu-duty-v4", OLDKEY="nicu-duty-v3";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(String(b).slice(0,10)+"T00:00:00Z")-new Date(String(a).slice(0,10)+"T00:00:00Z"))/864e5);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const r1=n=>(Math.round(n*10)/10).toFixed(1);
const range=n=>Array.from({length:n},(_,i)=>i+1);
// "21:30" -> "9:30 PM"
const to12=hm=>{const m=/^(\d{1,2}):(\d{2})/.exec(hm||"");if(!m)return hm||"";const h=+m[1];return (h%12||12)+":"+m[2]+" "+(h>=12?"PM":"AM")};
const fmtD=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+to12(pad(d.getHours())+":"+pad(d.getMinutes()));
// entries are dated by the shift date chosen at the top (real time of day), so notes written days later land on the right day
// shift date: today unless the user deliberately picked another date (back-dating). Resets to today on every launch.
const backDate=()=>typeof S!=="undefined"&&S&&S.dateFixed&&S.date&&S.date!==todayISO()?S.date:"";
const nowAt=()=>{const n=new Date(),bd=backDate();if(bd){const [y,m,d]=bd.split("-").map(Number);n.setFullYear(y,m-1,d)}return n};
const isoAt=()=>{const n=nowAt();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())+"T"+pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds())};
const stamp=()=>fmtD(nowAt());
const ddmm=()=>{const d=nowAt();return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
const fmtDT=v=>{if(!v)return"";if(!/^\d{4}-\d{2}-\d{2}/.test(v))return v;const [d,t]=v.split("T");const p=d.split("-");return p[2]+"/"+p[1]+(t&&!/^00:00/.test(t)?" "+to12(t.slice(0,5)):"")};
const today=()=>backDate()||todayISO();
const nowDT=()=>isoAt().slice(0,16);
// "14:30" -> ISO on the shift date; empty -> null (= now)
const atISO=hm=>/^\d{1,2}:\d{2}$/.test(hm||"")?today()+"T"+hm.padStart(5,"0")+":00":null;

/* ---------- unit layout ---------- */
const FLOORS={C3:["S1","S2"],C4:["S1","S2"],C6:["S1","S2","S3"],C7:["S1","S2","S3"]};
function bedOpts(fl,st){
  if(!fl||!st)return[];
  if(fl==="C3"||fl==="C4"){
    if(st==="S1")return[...range(4).map(i=>["ISO"+i,"ISO "+i]),...range(9).map(i=>[""+i,"Bed "+i])];
    return range(15).map(i=>[""+(i+9),"Bed "+(i+9)]); // S2 continues the numbering: beds 10–24
  }
  // C6 / C7: rooms numbered across the floor – S1 rooms 1–3, S2 rooms 4–6, S3 rooms 7–9 (4 beds each) + isolation rooms
  const r0=ROOM0[st]||0,o=[];for(const r of range(3))for(const b of range(4))o.push([`R${r+r0}-${b}`,`Room ${r+r0} · Bed ${b}`]);
  o.push(["ISO-R1","Isolation room 1"],["ISO-R2","Isolation room 2"]);return o;
}
const ROOM0={S1:0,S2:3,S3:6};
// v68 bed numbering: babies saved with the old numbers (C3/C4 S2 beds 1–15, C6/C7 S2/S3 rooms 1–3) move to the new numbers once
function bedMigrate(b){const f=b.f;if(b.bedv>=2)return;b.bedv=2;if(!f.bedno)return;
  if((f.floor==="C3"||f.floor==="C4")&&f.station==="S2"&&/^\d+$/.test(f.bedno)&&+f.bedno<=15)f.bedno=String(+f.bedno+9);
  else if((f.floor==="C6"||f.floor==="C7")&&ROOM0[f.station]){const m=/^R([1-3])-(\d)$/.exec(f.bedno);if(m)f.bedno=`R${+m[1]+ROOM0[f.station]}-${m[2]}`}}
function bedShort(v){if(!v)return"";if(/^ISO\d$/.test(v))return"ISO "+v.slice(3);if(/^ISO-R/.test(v))return"Iso R"+v.slice(5);
  const m=v.match(/^R(\d)-(\d)$/);if(m)return`R${m[1]} · B${m[2]}`;return"Bed "+v}
function locSort(b){const f=b.f,fl=Object.keys(FLOORS).indexOf(f.floor),st=(FLOORS[f.floor]||[]).indexOf(f.station),
  bi=bedOpts(f.floor,f.station).findIndex(o=>o[0]===f.bedno);return[fl<0?99:fl,st<0?99:st,bi<0?99:bi]}
const byLoc=(a,b)=>{const x=locSort(a),y=locSort(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]};
function locLine(b){const f=b.f;return[f.floor,f.station].filter(Boolean).join(" · ")}
function locFull(b){const f=b.f;return[f.floor,f.station,bedShort(f.bedno)].filter(Boolean).join(" ")||"No bed set"}

/* ---------- clinical helpers ---------- */
const RP={pip:["PIP","cmH₂O"],peep:["PEEP","cmH₂O"],rate:["Rate","/min"],ti:["Ti","s"],vt:["Vt","ml/kg"],map:["MAP","cmH₂O"],amp:["Amplitude","cmH₂O"],hz:["Frequency","Hz"],ie:["I:E",""],flow:["Flow","L/min"],fio2:["FiO₂","%"],ps:["PS","cmH₂O"],phi:["P high","cmH₂O"],plo:["P low","cmH₂O"],thi:["T high","s"]};
const VENT=["pip","peep","rate","ti","fio2"],VENTV=["pip","peep","rate","ti","vt","fio2"];
const MODES={"Room air":[],"Low-flow O₂":["flow","fio2"],"HFNC":["flow","fio2"],"CPAP":["peep","flow","fio2"],"SiPAP / BiPAP":["phi","plo","rate","thi","fio2"],"NIPPV":["pip","peep","rate","ti","fio2"],
  "SIMV":VENT,"SIMV + PS":["pip","peep","rate","ti","ps","fio2"],"A/C":VENT,"SIMV + VG":VENTV,"A/C + VG":VENTV,"PC":VENT,"PSV":VENT,"HFOV":["map","amp","hz","ie","fio2"],"HFOV + VG":["map","vt","hz","ie","fio2"],"HFJV":["pip","peep","rate","ti","fio2"]};
const modeParams=f=>f.resp?(MODES[f.resp]||Object.keys(RP)):["fio2"];
const respStr=f=>{const p=modeParams(f).filter(k=>f["rp_"+k]).map(k=>`${RP[k][0]} ${f["rp_"+k]}${k==="fio2"?"%":""}`.trim()).join(" / ");return f.resp?f.resp+(p?" – "+p:""):""};
// typical values per 100 ml (k = kcal, c = carbohydrate g); brands vary
const MILK={"EBM":{k:67,c:7.0},"Donor milk":{k:65,c:7.0},"EBM + fortifier":{k:80,c:8.0},"Donor + fortifier":{k:78,c:8.0},"Preterm formula":{k:80,c:8.4},"Term formula":{k:67,c:7.3}};
const isNPO=f=>/^\s*npo/i.test(f.fmlkg||"");
const inoRow=i=>f=>i===1||!!String(f["ino"+(i-1)]||"").trim()||!!String(f["ino"+i]||"").trim()||!!f["ino"+i+"d"];
const isHIE=f=>/\bHIE\b|asphyxia|cooling|hypotherm|whole[- ]?body/i.test((f.dx||"")+" "+(f.cprob||""));
const apOpen=f=>num(f.ap5)!=null&&num(f.ap5)<7; // NRP / AAP–ACOG: keep scoring every 5 min up to 20 min when the 5-min Apgar is < 7
const isVent=f=>/SIMV|A\/C|^PC$|PSV|HFOV|HFJV/.test(f.resp||"");
const noOn=f=>/^(On|Weaning)$/.test(f.nitric||"");
// iNO boxes appear for PPHN or hypoxaemic respiratory failure: written in diagnosis / problems / echo, an OI > 15 on the latest gas,
// or while iNO is running (so an active treatment is never hidden)
// hypoxaemic respiratory failure written in Diagnosis / Current problems (OI > 15 on the latest gas also counts – see noShow)
const isHRF=f=>/hypox\w*\s+resp\w*\s+fail|\bHRF\b/i.test((f.dx||"")+" "+(f.cprob||""));
const noShow=(f,b)=>isPPHN(f)||isHRF(f)||noOn(f)||(!!b&&(()=>{const o=oxLatest(b);return!!o&&o.oi!=null&&o.oi>15})());
// linked data: latest X-ray in the Imaging list (shown under CXR) and latest TSB in the lab table (shown in Jaundice)
const lastXr=b=>b?[...(b.img||[])].filter(x=>x.t==="X-ray"&&(x.a||"").trim()).sort((p,q)=>String(p.d||"").localeCompare(String(q.d||""))).pop()||null:null;
const labTsb=b=>{if(!b)return null;for(let i=(b.inv||[]).length-1;i>=0;i--){const c=b.inv[i];if(num(c.tsb)!=null)return{v:c.tsb,t:c.t||""}}return null};
// OI / OSI rows in the gas table: PPHN in diagnosis / problems / echo, a PPHN echo exam, or invasive ventilation
const oiOn=b=>isPPHN(b.f)||(b.echoph||[]).length>0||isVent(b.f);
// value boxes and bullet lists used inside automatic boxes
const vbox=(lab,v,u,cls)=>v==null||v===""?"":`<span class="vchip${cls?" "+cls:""}"><small>${lab}</small><b>${esc(v)}${u?` <i>${u}</i>`:""}</b></span>`;
const bullets=a=>{a=a.filter(Boolean);return a.length?`<ul class="cbul">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:""};
// what is missing for OI (arterial) / OSI (capillary / venous)
const oxNeed=g=>{const m=[];if(!g.src)m.push("site (Art / Cap / Ven)");if(num(g.fio2)==null)m.push("FiO₂");if(num(g.mapaw)==null)m.push("MAP");if(g.src==="Art"){if(num(g.po2)==null)m.push("pO₂")}else if(num(g.spo2)==null)m.push("SpO₂");return m};
function gasBoxes(g,prev,lab){if(!g)return"";const u=gasU(),oi=num(oiCalc(g,"oi")),os=num(oiCalc(g,"osi"));
  const ar=k=>{if(!prev)return"";const a=num(g[k]),p=num(prev[k]);return a==null||p==null||a===p?"":a>p?" ↑":" ↓"};
  const v=(l,k,un)=>vbox(l+ar(k),g[k],un);
  const need=oi==null&&os==null?oxNeed(g):[];
  return `<div class="vhead">${lab?esc(lab)+" · ":""}${esc(gTime(g)||g.t||"")}${g.src?" · "+esc({Art:"Arterial",Cap:"Capillary",Ven:"Venous"}[g.src]||g.src):""}</div><div class="vchips">`+
    v("pH","ph")+v("pCO₂","pco2",u)+v("pO₂","po2",u)+v("HCO₃","hco3","mmol/L")+v("BE","be","mmol/L")+v("Lactate","lac","mmol/L")+v("Na","na","mmol/L")+v("K","k","mmol/L")+v("Cl","cl","mmol/L")+
    vbox("FiO₂",g.fio2,"%")+vbox("MAP",g.mapaw,"cmH₂O")+vbox("SpO₂",g.spo2,"%")+
    (oi!=null?vbox("OI"+(oiBand(oi)?" · "+oiBand(oi):""),oi,"",oi>15?"hi":"calc"):"")+(os!=null?vbox("OSI",os,"",os>15?"hi":"calc"):"")+
    (isMA(g)?(agCalc(g)!=null?vbox("Anion gap"+(agCalc(g)>16?" · high":""),agCalc(g),"mmol/L",agCalc(g)>16?"hi":"calc"):`<span class="vchip oxneed"><small>Anion gap</small><b><i>needs Na, Cl</i></b></span>`):"")+
    (need.length?`<span class="vchip oxneed"><small>${g.src==="Art"?"OI":g.src?"OSI":"OI / OSI"}</small><b><i>needs ${esc(need.join(", "))}</i></b></span>`:"")+`</div>`}
// last n gases (by date & time), newest first
const lastGasN=(b,n)=>{const g=b.gases.filter(x=>["ph","pco2","po2","hco3","be","lac"].some(k=>x[k])).map((e,i)=>({e,i}))
  .sort((p,q)=>((p.e.d||"")+(p.e.tm||"")).localeCompare((q.e.d||"")+(q.e.tm||""))||p.i-q.i).map(x=>x.e);return g.slice(-n).reverse()};
const setAuto=(id,html,empty)=>{const el=document.getElementById(id);if(!el)return;if(html){el.className="calc";el.innerHTML=html}else{el.className="calc empty";el.textContent=empty||""}};
function oxLatest(b){const L=[...(b.gases||[])].sort((x,y)=>String(gTime(x)||x.t||"").localeCompare(String(gTime(y)||y.t||"")));
  const g=L[L.length-1];if(!g)return null;const oi=num(oiCalc(g,"oi")),os=num(oiCalc(g,"osi"));return oi!=null||os!=null?{g,oi,os}:null}
const autoBox=(id,lab)=>`<div class="grid autob"><div class="fld wide"><span class="lbl">${lab} <span class="unit">automatic</span></span><div class="calc empty" id="${id}"></div></div></div>`;
// comment only when OI > 15
const oiBand=v=>v==null||v<=15?"":v<25?"moderate":v<40?"severe":"very severe";
const oxChip=(lab,v)=>`<span class="oxchip${v>15?" hi":""}">${lab?lab+" ":""}${v}</span>`;
const isPPHN=f=>/pphn|pulmonary\s+hypertension|persistent\s+pulmonary/i.test((f.dx||"")+" "+(f.cprob||"")+" "+(f.echo||""));
const isAC=f=>isHIE(f)||f.seiz==="Suspected"||f.seiz==="Confirmed"||!!(f.ac1||f.ac2||f.ac3);
const acStr=f=>[1,2,3].map(i=>f["ac"+i]&&[f["ac"+i],f["ac"+i+"l"]&&`load ${f["ac"+i+"l"]} mg/kg`,f["ac"+i+"m"]&&`maint ${f["ac"+i+"m"]} mg/kg/day`,f["ac"+i+"i"]].filter(Boolean).join(" ")).filter(Boolean);
const isCaff=f=>f.caff==="Yes";
const isAmp=f=>/Aminoplasmin/.test(f.ftype||"");
const lytesOn=f=>!!f.ftype&&!/^(TPN|Dextrose only|Dextrose \+ Aminoplasmin|Numeta.*)$/.test(f.ftype);
const ADMFROM=["","PNW (postnatal ward)","LR (labour room)","OT (operating theatre)","Paediatric ward","Paediatric emergency","Private hospital","Other MOH hospital","Other hospital"];
const privAdm=f=>/Private|Other/.test(f.admfrom||"");
// ---- baby transferred from another hospital: what happened there, per system ----
const rfHosp=f=>(f.admhosp||"").trim()||String(f.admfrom||"other hospital").replace(/ \(.*$/,"");
const rfSurfN=f=>parseInt(f.rf_surf,10)||0;
const admAgeH=f=>{const bd=birthDate(f);if(!bd||!f.admdt)return null;const h=(new Date(f.admdt+":00")-bd)/36e5;return isNaN(h)||h<0?null:h};
const rfAbxNames=f=>String(f.rf_abx||"").split(/\s*(?:\+|,|&|\band\b)\s*/i).map(x=>x.trim()).filter(Boolean).map(x=>Object.keys(DRUGS).find(k=>k.toLowerCase()===x.toLowerCase())||x);
const RFSYS=[["resp","Resp"],["cvs","CVS"],["fl","Fluids"],["inf","Infection"],["lines","Lines"],["neuro","Neuro"],["oth","Other"]];
const RFSEC={respiratory:"resp",cardiovascular:"cvs",fluids:"fl",infection:"inf",lines:"lines",neuro:"neuro"};
function rfChips(f,k){const t=v=>v?" "+fmtDT(v):"";let c=[];
  if(k==="resp")c=[f.rf_resp&&f.rf_resp+(num(f.rf_fio2)!=null?`, FiO₂ max ${f.rf_fio2} %`:""),rfSurfN(f)>0&&`surfactant ×${rfSurfN(f)}${t(f.rf_surft)}`,...items(f.rf_respn)];
  else if(k==="cvs")c=[f.rf_ino&&"inotropes: "+f.rf_ino,f.rf_bolus&&"bolus "+f.rf_bolus,...items(f.rf_cvsn)];
  else if(k==="fl")c=[f.rf_ivf&&"IVF "+f.rf_ivf,f.rf_feed&&"feeds: "+f.rf_feed,num(f.rf_glu)!=null&&`lowest glucose ${f.rf_glu} mmol/L`,...items(f.rf_fln)];
  else if(k==="inf")c=[f.rf_abx&&f.rf_abx+(f.rf_abxt?" from"+t(f.rf_abxt):""),f.rf_cult==="Yes"&&`${f.rf_cults||"Blood"} culture sent${t(f.rf_cultt)}`,...items(f.rf_infn)];

const hm24=v=>{const s=String(v||"").trim();if(!s)return"";const m=s.match(/^(\d{1,2})[:.]?(\d{2})$/);if(!m)return null;const h=+m[1],mi=+m[2];return h<24&&mi<60?pad(h)+":"+pad(mi):null};

  const ref=today(),y=+ref.slice(0,4);let iso=y+"-"+pad(mo)+"-"+pad(d);if(daysBetween(ref,iso)>31)iso=(y-1)+"-"+pad(mo)+"-"+pad(d);return iso};
const tPart=v=>{const m=/^(\d{2}):(\d{2})/.exec(v||""),h=m?+m[1]:null;
  return `<input class="inp t24" type="text" inputmode="numeric" maxlength="5" placeholder="h:mm" autocomplete="off" value="${m?(h%12||12)+":"+m[2]:""}" aria-label="Time">`+
    `<select class="inp ap" aria-label="AM or PM"><option value="">–</option><option${m&&h<12?" selected":""}>AM</option><option${m&&h>=12?" selected":""}>PM</option></select>`};
// typed h:mm + AM/PM -> "HH:MM" (24 h, for saving). A time typed as 24 h (e.g. 21:30) is accepted and AM/PM set.
const hm12=(v,A)=>{const s=String(v||"").trim();if(!s)return"";const m=s.match(/^(\d{1,2})[:.]?(\d{2})$/);if(!m)return null;const h=+m[1],mi=+m[2];if(mi>59||h>23)return null;

  (root||document).querySelectorAll('input[type=time]:not([data-enh]),input[type=datetime-local]:not([data-enh]),input[type=date][data-dm]:not([data-enh])').forEach(o=>{

     const name=(o.getAttribute("aria-label")||(lab&&lab.textContent)||"").replace(/\s+/g," ").trim();

        if(x.classList.contains("t24")){if(/^n/i.test(s)){const n=nowAt(),h=n.getHours();s=(h%12||12)+":"+pad(n.getMinutes());A.value=h>=12?"PM":"AM"}else if(/^\d{4}$/.test(s))s=+s.slice(0,2)+":"+s.slice(2);else if(/^[2-9]\d{2}$/.test(s))s=s[0]+":"+s.slice(1)}

  });
}

  if(a==="copyall")return copy(`NICU SBAR handover – ${S.floor||"all floors"} – ${dmy(today())}\n\n`+visible().map(handover).join("\n\n————————\n\n"));
  if(a==="delbaby"){
    if(!el.classList.contains("arm")){el.classList.add("arm");el.textContent="Tap again to delete";clearTimeout(armTimer);
      armTimer=setTimeout(()=>{el.classList.remove("arm");el.textContent="Delete this baby"},3500);return}
    S.gone[b.id]=Date.now();S.babies=S.babies.filter(x=>x.id!==b.id);S.cur=visible()[0]?.id;save();render();toast("Deleted");
  }
});
// every launch starts on today's date; back-dating is a deliberate choice that shows a banner
S.date=todayISO();S.dateFixed=false;
$("#shiftDate").value=today();$("#floorFilter").value=S.floor||"";
const markDate=()=>{const el=$("#shiftDate"),p=!!backDate();el.classList.toggle("past",p);el.title=p?"Back-dated: new entries will be dated "+dmy(S.date):"Today";banners()};
$("#shiftDate").addEventListener("input",e=>{const v=e.target.value||todayISO();S.date=v;S.dateFixed=v!==todayISO();if(!e.target.value)e.target.value=v;save();markDate();render()});
// midnight roll-over (night shift) and coming back to the app on a later day
let lastDay=todayISO();
const dayTick=()=>{const t=todayISO();if(t!==lastDay){lastDay=t;if(!S.dateFixed){S.date=t;$("#shiftDate").value=t}markDate();render()}};
setInterval(dayTick,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)dayTick()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().then(ok=>{S.persist=!!ok})}catch(e){}
markDate();
{const dl=$("#tasktimes"),hs=[];for(let i=0;i<24;i++)hs.push(to12(pad((i+7)%24)+":00"));if(dl)dl.innerHTML=["Now","STAT","With the round","Before handover",...hs].map(x=>`<option>${x}</option>`).join("")}
$("#floorFilter").addEventListener("input",e=>{S.floor=e.target.value;S.cur=visible()[0]?.id;save();render()});
save();render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
