<style>
/* Layout: sticky unit bar (floor filter + bed tabs + station work plans), one stacked per-baby form below */
:root{
  --bg:#F3F6F7; --panel:#FFFFFF; --ink:#14232A; --muted:#5B6E76; --line:#D6E0E3;
  --accent:#0F6E7A; --accent-soft:#E0F0F2; --field:#F8FAFB;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#A86700; --warn-soft:#FBF0DC; --crit:#B3261E; --crit-soft:#FBE4E2;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1518; --panel:#152126; --ink:#E4EEF0; --muted:#8FA4AB; --line:#26363C;
  --accent:#5CC3CF; --accent-soft:#163338; --field:#0F1A1E;
  --ok:#6CCB8F; --ok-soft:#173023; --warn:#F0B44C; --warn-soft:#33270F; --crit:#F2877F; --crit-soft:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1518; --panel:#152126; --ink:#E4EEF0; --muted:#8FA4AB; --line:#26363C;
  --accent:#5CC3CF; --accent-soft:#163338; --field:#0F1A1E;
  --ok:#6CCB8F; --ok-soft:#173023; --warn:#F0B44C; --warn-soft:#33270F; --crit:#F2877F; --crit-soft:#3A1A18; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 8px}
.toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.shift{display:flex;gap:6px;flex-wrap:wrap}
.shift input,.shift select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.beds{display:flex;gap:8px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:thin}
.bed{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:92px;padding:8px 10px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;position:relative;text-align:left}
.bed::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--sev,var(--line))}
.bed[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bed i{font:normal 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.bed b{font-size:15px}
.bed span{font:12px var(--f-mono);color:var(--muted)}
.bed.add{justify-content:center;align-items:center;color:var(--accent);border-style:dashed;font-weight:700}
.bed.add::before,.bed.wp::before{display:none}
.bed.wp{background:var(--accent-soft);border-color:transparent}
.bed.wp i{color:var(--accent);font-weight:600;text-transform:uppercase}
.bed.wp[aria-current="true"]{border-color:var(--accent)}
.sep{flex:0 0 1px;background:var(--line);margin-block:6px}
.sev-Stable{--sev:var(--ok)} .sev-Watcher{--sev:var(--warn)} .sev-Unstable{--sev:var(--crit)}

.babyhead{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-block:14px 10px}
.babyhead .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.babyhead h1{margin:0;font-size:22px;line-height:1.15;text-wrap:balance}
.babyhead .meta{font:14px var(--f-mono);color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.sev-Stable{background:var(--ok-soft);color:var(--ok)} .pill.sev-Watcher{background:var(--warn-soft);color:var(--warn)} .pill.sev-Unstable{background:var(--crit-soft);color:var(--crit)}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
section.card>h2{margin:0;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);padding:9px 12px 0}
section.card>h2 .fold{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left;cursor:pointer;min-height:24px}
section.card>h2 .fold::after{content:"▾";font-size:15px;transition:transform .15s}
section.card.folded>h2{padding-bottom:9px}
section.card.folded>h2 .fold::after{transform:rotate(-90deg)}
section.card.folded>:not(h2){display:none!important}
@media (min-width:1000px){.cols{columns:2;column-gap:10px}.cols>section.card{display:inline-block;width:100%;vertical-align:top;break-inside:avoid;-webkit-column-break-inside:avoid}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 10px;padding:6px 12px 10px}
.sub{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.grid>.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld.span2{grid-column:span 2}
.frow{grid-column:1/-1;display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.frow>.fld{flex:var(--g,1) 1 0;min-width:var(--mw,76px)}
.frow .inp{font-size:16px;padding:6px 8px}
.frow .inp:not(textarea),.frow .calc{height:40px;box-sizing:border-box}
.frow .calc{display:flex;align-items:center}
.grid{align-items:end}
.para.gab .inp{width:3.6em!important;height:42px;font-size:18px;text-align:center}
.para.gab select.inp{width:3.6em!important}
.frow .para{flex-wrap:nowrap;gap:4px}
.frow .para .inp{flex:none;width:2.8em;padding:6px 1px;height:42px}
.frow .para{gap:3px}
.frow .para select.inp{flex:none;width:3.6em}
.para .pg{flex:none;width:3.6em;padding:6px 2px}
.pbox{display:contents}
.frow .dcb{min-height:38px;padding:0 12px}
table.sheet.bgt .inp{width:70px}
.fld label,.fld .lbl{font-size:12.5px;color:var(--muted)}
.fld .unit{font-size:11.5px;color:var(--muted)}
.inp{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:38px;font-size:16px}
input.inp[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea.inp{min-height:44px;resize:vertical}
input.inp[type=date],input.inp[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
textarea.inp.big{min-height:60px}
.calc{background:var(--accent-soft);border-radius:8px;padding:6px 9px;font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;min-height:38px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.calc small{font:400 12px var(--f-body);color:var(--muted)}
.calc.empty{color:var(--muted);font-weight:400;font-family:var(--f-body);font-size:13px}
.para{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:600 15px var(--f-mono)}
.para .inp{width:3.6em;text-align:center;padding:6px 4px}
.para select.inp{width:4.6em;padding:6px 4px}
.para .unit{font:400 14px var(--f-body);color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"].s-Stable{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.seg button[aria-pressed="true"].s-Watcher{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button[aria-pressed="true"].s-Unstable{background:var(--crit-soft);border-color:var(--crit);color:var(--crit);font-weight:700}

/* sheets (params down, time across) */
.tblbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 4px;flex-wrap:wrap}
.tblbar .sub{border:0;padding:0;margin:0}
.tblwrap{overflow-x:auto;margin:0 12px 10px;border:1px solid var(--line);border-radius:10px}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13px}
table.sheet th,table.sheet td{padding:3px;border-bottom:1px solid var(--line)}
table.sheet tr:last-child>*{border-bottom:0}
table.sheet tbody th{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;font-weight:700;padding:4px 10px;white-space:nowrap;min-width:84px;border-right:1px solid var(--line)}
table.sheet tbody th.xrow{padding:3px 4px}
table.sheet thead th{background:var(--accent-soft)}
table.sheet thead th:first-child{position:sticky;left:0;z-index:2;text-align:left;padding:4px 10px;color:var(--accent);border-right:1px solid var(--line)}
table.sheet tr.grp th{background:var(--field);color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
table.sheet tr.grp td{background:var(--field)}
table.sheet.ref td{padding:8px 14px;font:16px var(--f-mono);text-align:center}
table.sheet.ref thead th{padding:8px 12px;white-space:nowrap}
table.sheet.ref tr.on>*{background:var(--accent-soft);color:var(--accent)}
.hint br+*{margin:0}
table.sheet .inp{min-height:34px;padding:4px 6px;width:100px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px}
table.sheet select.inp{padding:5px 2px}
.colh{display:flex;align-items:center;gap:2px}
.colh .inp{width:96px;background:var(--panel)}
th.xrow .inp{width:116px;font-family:var(--f-body);font-weight:700}
.colh .x{height:30px;min-width:24px;font-size:16px}
.x.arm{background:var(--crit);color:var(--panel)}
.nocol{padding:10px 12px;color:var(--muted);font-size:13px;font-weight:400;white-space:nowrap}
.under{padding:0 14px 14px;margin-top:-6px}

.list{padding:2px 12px 10px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:8px;align-items:center}
.row.dated{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 56px 58px 32px}
.row.prev{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 32px;align-items:end}
details.calcref{margin:2px 12px 10px;border:1px solid var(--line);border-radius:10px}
details.calcref>summary{cursor:pointer;padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.calcref>summary::-webkit-details-marker{display:none}
details.calcref>summary::after{content:"Show ▸";font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent)}
details.calcref[open]>summary::after{content:"Hide ▾"}
details.calcref .tblwrap{margin:0 10px 8px}details.calcref .hint{padding:0 12px}
.row.img{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 32px;align-items:end}
.row.img .res{grid-column:1/-1;min-height:56px}
.row.img + .row.img{border-top:1px solid var(--line);padding-top:8px}
.row.todo{grid-template-columns:28px 76px minmax(0,1fr) 36px}
.row .day{font:600 13px var(--f-mono);color:var(--accent);text-align:center}
.row.todo.done .inp{text-decoration:line-through;color:var(--muted)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.mini{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px;height:36px;min-width:32px}
.x:hover{background:var(--field);color:var(--crit)}
.addrow{align-self:flex-start;border:1px dashed var(--line);background:none;color:var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px}
.hint{font-size:12px;color:var(--muted);padding:0 12px;margin:0 0 4px}
.auto{list-style:none;margin:0;padding:6px 14px 4px;display:flex;flex-direction:column;gap:6px}
.auto li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.auto li small{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.auto li b{font-weight:400}
.auto li b em{font-style:normal;font:600 12.5px var(--f-mono);color:var(--accent);margin-left:6px}
.auto .empty{display:block;background:none;border:0;color:var(--muted);font-size:13px;padding:0}

.log{list-style:none;margin:0;padding:0 14px 6px;display:flex;flex-direction:column;gap:2px}
.log li{display:grid;grid-template-columns:96px minmax(0,1fr) 32px;align-items:center;gap:8px;border-left:2px solid var(--accent);padding:3px 0 3px 10px}
.log time{font:12.5px var(--f-mono);color:var(--muted)}
.log .x{height:28px;font-size:18px}
.log .empty{border-left-color:var(--line);display:block;color:var(--muted);font-size:13px}

/* work plan */
.wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.wpc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sev,var(--line));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wpc header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.wpname{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.wpname i{font:normal 12px var(--f-mono);color:var(--muted)}
.wpname b{font-size:17px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.wpc dl{margin:0;display:grid;grid-template-columns:74px minmax(0,1fr);gap:3px 10px;font-size:15px;line-height:1.35}
.wpc dd.key{font-weight:700}
.wpc dd.flag{color:var(--crit)}
.wpname .miss{color:var(--crit);font-weight:700}
.wpc dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.wpc dd{margin:0;min-width:0;overflow-wrap:anywhere}
.wpc dd .mono{font-family:var(--f-mono);font-size:13.5px}
.wptodo{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.wpfam{display:flex;justify-content:flex-end}
.wptodo .ttl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wptodo label{display:grid;grid-template-columns:22px 52px minmax(0,1fr);gap:6px;align-items:start;font-size:14px;cursor:pointer}
.wptodo label input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.wptodo label .tm{font:12.5px var(--f-mono);color:var(--muted);padding-top:1px}
.wptodo label.done span:last-child{text-decoration:line-through;color:var(--muted)}
.wpadd{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:6px}
.wpadd .inp{min-height:42px;padding:6px 8px;font-size:17px}

.ho{padding:6px 12px 10px;display:flex;flex-direction:column;gap:8px}
.ho textarea{font:14px/1.45 var(--f-mono);min-height:180px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--crit);background:none;color:var(--crit)}
.btn.danger.arm{background:var(--crit);color:var(--panel)}
#shiftDate.past{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:700}
.pwdlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.pwdlg form{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.pwdlg b{font-size:17px}.pwdlg p{margin:0;font-size:14px;color:var(--muted)}
.pwdlg .rem{display:flex;gap:8px;align-items:center;font-size:14px}.pwdlg .rem input{width:20px;height:20px;accent-color:var(--accent)}
.pwdlg .err{color:var(--crit);font-size:13px;min-height:1em}.pwdlg .btns{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.foot{font-size:12.5px;color:var(--muted);margin-top:18px;max-width:65ch}
@media (max-width:520px){
  .row.dated{grid-template-columns:minmax(0,1fr) 52px 58px 32px}
  .row.dated .nm,.row.prev .nm{grid-column:1/-1}
  .row.prev{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}
  .row.img{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}.row.img>select{grid-column:1/-1}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log li{grid-template-columns:84px minmax(0,1fr) 28px}
  .wpgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
#printout{display:none}

@media print{
  @page{size:A4;margin:8mm}
  :root{--bg:#fff;--panel:#fff;--field:#fff;--ink:#000;--muted:#555;--line:#bbb;--accent:#0F6E7A;--accent-soft:#fff;color-scheme:light}
  body{background:#fff;color:#000;font:9px/1.3 var(--f-body)}
  header.top,#main,.toast{display:none!important}
  #printout{display:block}
  #printout .ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid #000;padding-bottom:2px;margin-bottom:3px}
  #printout .ph b{font-size:12px}#printout .ph span{font:8px var(--f-mono);color:#444}
  #printout .cols{columns:2;column-gap:5mm;column-rule:.5px solid #ddd}
  #printout section.card{display:block;break-inside:avoid;page-break-inside:avoid;border:0;border-top:.75px solid #888;border-radius:0;margin:0 0 3px;padding:1px 0 0;background:none;width:auto}
  #printout section.card>h2{font:700 8px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 1px}
  #printout .grid,#printout .frow,#printout .list,#printout .ho{display:block;padding:0;margin:0;gap:0;overflow:visible}
  #printout .sub{display:block;border:0;padding:0;margin:1px 0 0;font:700 7px var(--f-body);letter-spacing:.05em;color:#666}
  #printout .fld{display:inline;margin:0 7px 0 0}
  #printout .fld label,#printout .fld .lbl{display:inline;font-size:8px;color:#555}
  #printout .fld label::after,#printout .fld>.lbl::after{content:": "}
  #printout .unit{font-size:7px;color:#888}
  #printout .v{font-weight:700;white-space:pre-wrap}
  #printout .para{display:inline;font:inherit;gap:0}
  #printout .calc{display:inline;background:none;padding:0;min-height:0;font:700 9px var(--f-mono)}
  #printout .calc small{font-size:7px;font-weight:400}
  #printout .wide .v{display:inline}
  #printout .row{display:block;margin:0}#printout .row>*{display:inline;margin-right:5px}
  #printout .row .day{font:600 8px var(--f-mono)}
  #printout .mini{display:inline;font-size:8px}
  #printout .tblbar{display:block;padding:0}#printout .tblbar .sub{margin-top:1px}
  #printout .tblwrap{overflow:visible;margin:0;border:0}
  #printout table.sheet{font-size:8px;border-collapse:collapse}
  #printout table.sheet th,#printout table.sheet td{padding:0 3px;border:.5px solid #ccc;min-width:0;position:static;background:none;white-space:nowrap}
  #printout table.sheet tr.grp>*{font-size:6.5px;color:#666;padding:0 3px}
  #printout [data-sheet] table.sheet tr>:nth-child(n+2):nth-last-child(n+5){display:none}
  #printout .log,#printout .auto{display:block;padding:0;margin:0;list-style:none}
  #printout .log li{display:block;border:0;padding:0;font-size:8px}
  #printout .log li:nth-last-child(n+5){display:none}
  #printout .log time{font-size:7.5px;margin-right:4px}
  #printout .auto li{display:inline;background:none;border:0;padding:0;margin-right:6px}
  #printout .auto li small{display:none}
  #printout .auto li b em{font-size:7.5px;margin-left:2px}
  #printout .seg{display:inline}
  #printout .wptodo,#printout .row.todo{font-size:8.5px}
}
:root{color-scheme:light}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
header.top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}

header.top{padding-bottom:6px}
.beds{padding-block:6px 0;gap:6px}
.bed{padding:4px 10px 4px 12px;gap:0}
.babyhead{margin-block:8px 6px}

.grid{gap:3px 8px;padding:3px 10px 7px}

textarea.inp.big{min-height:50px}

.tblwrap{margin:0 10px 7px}
table.sheet .inp{min-height:30px;padding:2px 6px}
table.sheet th,table.sheet td{padding:2px}
.list{padding:2px 10px 7px;gap:4px}
.row{gap:6px}
.hint{margin-bottom:2px}

.auto{padding:3px 10px 2px;gap:4px}

.x{height:30px}
.addrow{padding:3px 10px}
details.calcref{margin:2px 10px 7px}details.calcref>summary{padding:5px 10px}

/* v2 additions */
.row.med{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--field)}
.row.med .l1{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 56px 58px 32px;gap:6px;align-items:center;width:100%}

.row.bp{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 32px}
.row.gr{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 32px;align-items:end}
.chart{margin:4px 10px 8px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel)}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12px;color:var(--muted);padding:2px 6px}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart text.ttl{fill:var(--ink);font:700 13px var(--f-body)}
.refnote{font-size:12px;color:var(--muted);padding:0 12px 6px;margin:0}
.ctab td,.ctab th{white-space:nowrap}
#acbox{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);overflow-y:auto;max-height:260px}
#acbox button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font-size:16px;cursor:pointer;color:var(--ink)}
#acbox button:hover,#acbox button.on{background:var(--accent-soft)}
.colt{display:flex;flex-direction:column;gap:2px}.colt .inp{width:128px}
td.tt{font:700 15px var(--f-mono);text-align:center;color:var(--accent);padding:4px 8px;white-space:nowrap}
@media (max-width:520px){.row.med .l1{grid-template-columns:minmax(0,1fr) 52px 58px 32px}.row.med .l1 .nm{grid-column:1/-1}}
.sbar{display:flex;flex-direction:column;gap:8px}
.sbhead{font-weight:700;font-size:15px}
.sb{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:6px 10px 8px;background:var(--field)}
.sb header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sb header b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:auto}
.sbl{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--panel);font-weight:700}
.sb .hl{font-size:14.5px;line-height:1.4;padding:1px 0;overflow-wrap:anywhere}
.sb .hl b{color:var(--muted);font-weight:700;margin-right:4px}
.sb .hl.ind{padding-left:16px}
.sb .hl.empty{color:var(--muted)}
.sb-S{border-left-color:var(--warn)}.sb-B{border-left-color:var(--accent)}.sb-A{border-left-color:var(--ok)}.sb-R{border-left-color:var(--crit)}

<body>

<header class="top"><div class="wrap">
  <div class="toprow">
    <div class="brand">NICU Duty Sheet<small>Per-baby follow-up</small></div>
    <div class="shift">
      <select id="floorFilter" aria-label="Show floor"><option value="">All floors</option><option>C3</option><option>C4</option><option>C6</option><option>C7</option></select>
      <input type="date" id="shiftDate" aria-label="Shift date">
      <select id="shiftType" aria-label="Shift"><option>Day</option><option>Night</option><option>24 h</option></select>
      <button type="button" class="btn ghost sm" data-act="backup" title="Share all babies to your other device (AirDrop)">⇪ Send</button>
      <label class="btn ghost sm" for="restoreIn" title="Open a file sent from your other device">⇩ Receive</label>
      <input type="file" id="restoreIn" accept="application/json,.json" hidden>
    </div>
  </div>
  <div class="beds" id="beds" role="tablist" aria-label="Babies and work plans"></div>
</div></header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status"></div>

<datalist id="acdrugs"><option>Phenobarbitone</option><option>Levetiracetam</option><option>Phenytoin</option><option>Fosphenytoin</option><option>Midazolam</option><option>Lidocaine</option><option>Topiramate</option><option>Pyridoxine</option></datalist><datalist id="inodrugs"><option>Dopamine</option><option>Dobutamine</option><option>Epinephrine</option><option>Norepinephrine</option><option>Milrinone</option><option>Vasopressin</option></datalist>
<datalist id="feedopts"><option>NPO</option></datalist>
<datalist id="aspcols"><option>Clear</option><option>Milky / undigested milk</option><option>Yellow</option><option>Green (bilious)</option><option>Brown / coffee-ground</option><option>Blood-stained (fresh red)</option></datalist>
<datalist id="ropfinds"><option>Immature retina, no ROP</option><option>Zone II stage 1</option><option>Zone II stage 2</option><option>Zone II stage 3</option><option>Zone II stage 2 + plus</option><option>Zone II stage 3 + plus</option><option>Zone I stage 1</option><option>Zone I stage 2</option><option>Zone III stage 1</option><option>Zone III stage 2</option><option>Aggressive ROP (A-ROP)</option><option>Regressing ROP</option><option>Regressed ROP</option><option>Fully vascularised</option></datalist>

<script>
(function(){
const KEY="nicu-duty-v4", OLDKEY="nicu-duty-v3";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const r1=n=>(Math.round(n*10)/10).toFixed(1);

const fmtD=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes());
// entries are dated by the shift date chosen at the top (real time of day), so notes written days later land on the right day
const nowAt=()=>{const n=new Date();if(typeof S!=="undefined"&&S&&S.date&&S.date!==todayISO()){const [y,m,d]=S.date.split("-").map(Number);n.setFullYear(y,m-1,d)}return n};
const isoAt=()=>{const n=nowAt();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())+"T"+pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds())};

/* ---------- unit layout ---------- */
const FLOORS={C3:["S1","S2"],C4:["S1","S2"],C6:["S1","S2","S3"],C7:["S1","S2","S3"]};
function bedOpts(fl,st){
  if(!fl||!st)return[];
  if(fl==="C3"||fl==="C4"){
    if(st==="S1")return[...range(4).map(i=>["ISO"+i,"ISO "+i]),...range(9).map(i=>[""+i,"Bed "+i])];
    return range(15).map(i=>[""+i,"Bed "+i]);
  }
  const o=[];for(const r of range(3))for(const b of range(4))o.push([`R${r}-${b}`,`Room ${r} · Bed ${b}`]);
  o.push(["ISO-R1","Isolation room 1"],["ISO-R2","Isolation room 2"]);return o;
}
function bedShort(v){if(!v)return"";if(/^ISO\d$/.test(v))return"ISO "+v.slice(3);if(/^ISO-R/.test(v))return"Iso R"+v.slice(5);
  const m=v.match(/^R(\d)-(\d)$/);if(m)return`R${m[1]} · B${m[2]}`;return"Bed "+v}
function locSort(b){const f=b.f,fl=Object.keys(FLOORS).indexOf(f.floor),st=(FLOORS[f.floor]||[]).indexOf(f.station),
  bi=bedOpts(f.floor,f.station).findIndex(o=>o[0]===f.bedno);return[fl<0?99:fl,st<0?99:st,bi<0?99:bi]}
const byLoc=(a,b)=>{const x=locSort(a),y=locSort(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]};
function locLine(b){const f=b.f;return[f.floor,f.station].filter(Boolean).join(" · ")}
function locFull(b){const f=b.f;return[f.floor,f.station,bedShort(f.bedno)].filter(Boolean).join(" ")||"No bed set"}

/* ---------- clinical helpers ---------- */
const RP={pip:["PIP","cmH₂O"],peep:["PEEP","cmH₂O"],rate:["Rate","/min"],ti:["Ti","s"],vt:["Vt","ml/kg"],map:["MAP","cmH₂O"],amp:["Amplitude","cmH₂O"],hz:["Frequency","Hz"],flow:["Flow","L/min"],fio2:["FiO₂","%"],ps:["PS","cmH₂O"]};
const VENT=["pip","peep","rate","ti","fio2"],VENTV=["pip","peep","rate","ti","vt","fio2"];
const MODES={"Room air":[],"Low-flow O₂":["flow","fio2"],"HFNC":["flow","fio2"],"CPAP":["peep","flow","fio2"],"NIPPV":["pip","peep","rate","ti","fio2"],
  "SIMV":VENT,"SIMV + PS":["pip","peep","rate","ti","ps","fio2"],"A/C":VENT,"SIMV + VG":VENTV,"A/C + VG":VENTV,"PC":VENT,"PSV":VENT,"HFOV":["map","amp","hz","fio2"],"HFOV + VG":["map","vt","hz","fio2"],"HFJV":["pip","peep","rate","ti","fio2"]};
const modeParams=f=>f.resp?(MODES[f.resp]||Object.keys(RP)):["fio2"];
const respStr=f=>{const p=modeParams(f).filter(k=>f["rp_"+k]).map(k=>`${RP[k][0]} ${f["rp_"+k]}${k==="fio2"?"%":""}`).join(" / ");return f.resp?f.resp+(p?" – "+p:""):""};
// typical values per 100 ml (k = kcal, c = carbohydrate g); brands vary
const MILK={"EBM":{k:67,c:7.0},"Donor milk":{k:65,c:7.0},"EBM + fortifier":{k:80,c:8.0},"Donor + fortifier":{k:78,c:8.0},"Preterm formula":{k:80,c:8.4},"Term formula":{k:67,c:7.3}};
const isNPO=f=>/^\s*npo/i.test(f.fmlkg||"");
const isHIE=f=>/\bHIE\b|asphyxia|cooling|hypotherm|whole[- ]?body/i.test((f.dx||"")+" "+(f.cprob||""));
const apOpen=f=>["ap1","ap5","ap10","ap15","ap20"].some(k=>num(f[k])!=null&&num(f[k])<6)||!!(f.ap10||f.ap15||f.ap20);
const isPPHN=f=>/pphn|pulmonary\s+hypertension|persistent\s+pulmonary/i.test((f.dx||"")+" "+(f.cprob||"")+" "+(f.echo||""));
const isAC=f=>isHIE(f)||f.seiz==="Suspected"||f.seiz==="Confirmed"||!!(f.ac1||f.ac2||f.ac3);
const acStr=f=>[1,2,3].map(i=>f["ac"+i]&&[f["ac"+i],f["ac"+i+"l"]&&`load ${f["ac"+i+"l"]} mg/kg`,f["ac"+i+"m"]&&`maint ${f["ac"+i+"m"]} mg/kg/day`,f["ac"+i+"i"]].filter(Boolean).join(" ")).filter(Boolean);
const isCaff=f=>f.caff==="Yes";
const isAmp=f=>/Aminoplasmin/.test(f.ftype||"");

/* ---------- sheets ---------- */
const GAS_ROWS=[{k:"src",l:"Site",o:["","Cap","Art","Ven"]},{k:"ph",l:"pH"},{k:"pco2",l:"pCO₂"},{k:"po2",l:"pO₂"},{k:"hco3",l:"HCO₃"},{k:"be",l:"BE"},{k:"lac",l:"Lact."},
 {k:"fio2",l:"FiO₂ %",pph:1},{k:"mapaw",l:"MAP cmH₂O",pph:1},{k:"spo2",l:"SpO₂ %",pph:1},{k:"oi",l:"OI",calc:true,pph:1},{k:"osi",l:"OSI",calc:true,pph:1},{k:"act",l:"Action"}];
function oiCalc(c,which){const map=num(c.mapaw),fi=num(c.fio2);if(map==null||fi==null)return"";const F_=fi>1?fi/100:fi;
  if(which==="oi"){let pa=num(c.po2);if(pa==null||pa<=0)return"";if(c.src&&c.src!=="Art")return"needs arterial";if(pa<30)pa*=7.50062;return r1(map*F_*100/pa)}
  const sp=num(c.spo2);return sp?r1(map*F_*100/sp):""}
const INV_ROWS=[{g:"Blood count & infection"},{k:"tlc",l:"TLC"},{k:"hb",l:"Hb"},{k:"plt",l:"Plt"},{k:"nrbc",l:"nRBCs"},{k:"retic",l:"Retics"},{k:"crp",l:"CRP"},{k:"pct",l:"PCT"},{k:"cs",l:"C/S"},{k:"swab",l:"Swabs"},
  {g:"Coagulation"},{k:"pt",l:"PT"},{k:"aptt",l:"APTT"},{k:"inr",l:"INR"},{k:"ddim",l:"D-dimer"},{k:"fib",l:"Fibrinogen"},
  {g:"Renal & electrolytes"},{k:"na",l:"Na"},{k:"k",l:"K"},{k:"urea",l:"Urea"},{k:"cr",l:"Cr"},{k:"ca",l:"Ca"},{k:"mg",l:"Mg"},{k:"po4",l:"PO₄"},
  {g:"Liver & bone"},{k:"tsb",l:"TSB"},{k:"dsb",l:"DSB"},{k:"alb",l:"Alb"},{k:"alt",l:"ALT"},{k:"ast",l:"AST"},{k:"ggt",l:"GGT"},{k:"alp",l:"ALP"},{k:"vitd",l:"Vit D"},{k:"pth",l:"PTH"}];
const SARN_ROWS=[
 {k:"loc",l:"Level of consciousness",o:["","1 Hyperalert","2 Lethargic / obtunded","3 Stuporous / coma"]},
 {k:"tone",l:"Muscle tone",o:["","1 Normal","2 Mild hypotonia","3 Flaccid"]},
 {k:"post",l:"Posture",o:["","1 Mild distal flexion","2 Strong distal flexion","3 Decerebrate"]},
 {k:"sm",l:"Suck / Moro",o:["","1 Weak suck, strong Moro","2 Weak / absent suck, weak Moro","3 Absent"]},
 {k:"aut",l:"Autonomic (pupils, HR)",o:["","1 Sympathetic (dilated, tachycardia)","2 Parasympathetic (small, bradycardia)","3 Both depressed"]},
 {k:"sz",l:"Seizures",o:["","1 None","2 Common","3 Uncommon"]},
 {k:"_st",l:"Stage",calc:true}];
const SHEETS={sarn:{btn:"+ New stage",empty:"No Sarnat staging yet. Tap + New stage.",newT:ddmm},thomp:{btn:"+ New score",empty:"No Thompson scores yet. Tap + New score.",newT:ddmm},gases:{btn:"+ New gas",empty:"No gases yet. Tap + New gas.",newT:stamp},inv:{btn:"+ New date",empty:"No results yet. Tap + New date.",newT:ddmm}};
const sheetRows=(key,b)=>key==="gases"?GAS_ROWS:key==="thomp"?THOMP_ROWS:key==="sarn"?SARN_ROWS:[...INV_ROWS,{g:"Special investigations"},{k:"tg",l:"TG"},...b.invx.map(x=>({k:"x_"+x.id,l:x.name,x:x.id}))];
const LINE_TYPES=["","UVC","UAC","PICC","Peripheral IV (PIV)","Central line (other)","ETT (oral)","ETT (nasal)","NIV prongs / mask","NG tube","OG tube","Chest drain","Urinary catheter","Surgical drain","Stoma","Other"];
const CONS_TYPES=["","Paediatric surgery","Neurology","Neurosurgery","Haematology","Cardiology","Nephrology","Ophthalmology (ROP)","ENT","Genetics","Metabolic","Endocrine","GI / hepatology","Orthopaedics","Plastic surgery","Urology","Dermatology","Physiotherapy","Nutrition / dietitian","Social work","Palliative care","Other"];

const INTERVALS=["","once","q4h","q6h","q8h","q12h","q24h","q36h","q48h","q72h","continuous","PRN"];
const UNITS=["mg","mcg","g","mL","units","IU","mmol","mEq"];
const BASES=["/kg/dose","/kg/day","/kg/h","/kg/min","/dose","/day"];

const DRUGS={"Ampicillin": ["mg", "/kg/dose", "q8–12h (by GA / postnatal age)"], "Amoxicillin": ["mg", "/kg/dose", "q8–12h"], "Gentamicin": ["mg", "/kg/dose", "q24–48h (by GA / postnatal age; check levels)"], "Amikacin": ["mg", "/kg/dose", "q24–48h (check levels)"], "Cefotaxime": ["mg", "/kg/dose", "q8–12h"], "Ceftazidime": ["mg", "/kg/dose", "q8–12h"], "Ceftriaxone": ["mg", "/kg/dose", "q24h"], "Cloxacillin": ["mg", "/kg/dose", "q8–12h"], "Flucloxacillin": ["mg", "/kg/dose", "q8–12h"], "Meropenem": ["mg", "/kg/dose", "q8–12h"], "Piperacillin-tazobactam": ["mg", "/kg/dose", "q8–12h"], "Vancomycin": ["mg", "/kg/dose", "q8–24h (by GA / levels)"], "Colistin": ["mg", "/kg/dose", "q8–12h"], "Metronidazole": ["mg", "/kg/dose", "q8–24h"], "Azithromycin": ["mg", "/kg/dose", "q24h"], "Erythromycin": ["mg", "/kg/dose", "q6–8h"], "Fluconazole": ["mg", "/kg/dose", "q24–72h (by GA / postnatal age)"], "Amphotericin B": ["mg", "/kg/dose", "q24h"], "Acyclovir": ["mg", "/kg/dose", "q8–12h"], "Caffeine citrate": ["mg", "/kg/day", "q24h"], "Paracetamol": ["mg", "/kg/dose", "q6–12h (by GA)"], "Ibuprofen": ["mg", "/kg/dose", "q24h"], "Indomethacin": ["mg", "/kg/dose", "q12–24h"], "Phenobarbitone": ["mg", "/kg/day", "q12–24h (loading: once)"], "Levetiracetam": ["mg", "/kg/dose", "q12h"], "Phenytoin": ["mg", "/kg/dose", "q8–12h"], "Midazolam": ["mcg", "/kg/h", "continuous"], "Morphine": ["mcg", "/kg/h", "continuous"], "Fentanyl": ["mcg", "/kg/h", "continuous"], "Furosemide": ["mg", "/kg/dose", "q12–24h"], "Spironolactone": ["mg", "/kg/day", "q12–24h"], "Hydrochlorothiazide": ["mg", "/kg/day", "q12h"], "Hydrocortisone": ["mg", "/kg/dose", "q6–12h"], "Dexamethasone": ["mg", "/kg/dose", "q12h"], "Vitamin D": ["IU", "/day", "q24h"], "Iron (elemental)": ["mg", "/kg/day", "q24h"], "Omeprazole": ["mg", "/kg/dose", "q12–24h"], "Ranitidine": ["mg", "/kg/dose", "q8–12h"], "Calcium gluconate": ["mL", "/kg/dose", "q6–12h"], "Sodium bicarbonate": ["mmol", "/kg/dose", "once / PRN"], "Vitamin K": ["mg", "/dose", "once"], "Sildenafil": ["mg", "/kg/dose", "q6–8h"], "Propranolol": ["mg", "/kg/dose", "q6–8h"], "Cholecalciferol": ["IU", "/day", "q24h"]};
const DRUGKEY=Object.fromEntries(Object.keys(DRUGS).map(k=>[k.toLowerCase(),DRUGS[k]]));
const NATS=["Afghan", "Albanian", "Algerian", "American", "Angolan", "Argentine", "Armenian", "Australian", "Austrian", "Azerbaijani", "Bahraini", "Bangladeshi", "Belarusian", "Belgian", "Beninese", "Bhutanese", "Bolivian", "Bosnian", "Brazilian", "British", "Bruneian", "Bulgarian", "Burkinabe", "Burmese", "Burundian", "Cambodian", "Cameroonian", "Canadian", "Chadian", "Chilean", "Chinese", "Colombian", "Comoran", "Congolese", "Croatian", "Cuban", "Cypriot", "Czech", "Danish", "Djiboutian", "Dutch", "Ecuadorian", "Egyptian", "Emirati", "Eritrean", "Estonian", "Ethiopian", "Filipino", "Finnish", "French", "Gabonese", "Gambian", "Georgian", "German", "Ghanaian", "Greek", "Guatemalan", "Guinean", "Haitian", "Honduran", "Hungarian", "Icelandic", "Indian", "Indonesian", "Iranian", "Iraqi", "Irish", "Italian", "Ivorian", "Jamaican", "Japanese", "Jordanian", "Kazakh", "Kenyan", "Korean", "Kuwaiti", "Kyrgyz", "Lao", "Latvian", "Lebanese", "Liberian", "Libyan", "Lithuanian", "Macedonian", "Malagasy", "Malawian", "Malaysian", "Maldivian", "Malian", "Maltese", "Mauritanian", "Mauritian", "Mexican", "Moldovan", "Mongolian", "Moroccan", "Mozambican", "Namibian", "Nepalese", "New Zealander", "Nicaraguan", "Nigerian", "Nigerien", "Norwegian", "Omani", "Pakistani", "Palestinian", "Panamanian", "Paraguayan", "Peruvian", "Polish", "Portuguese", "Qatari", "Romanian", "Russian", "Rwandan", "Saudi", "Senegalese", "Serbian", "Sierra Leonean", "Singaporean", "Slovak", "Slovenian", "Somali", "South African", "Spanish", "Sri Lankan", "Sudanese", "Swedish", "Swiss", "Syrian", "Taiwanese", "Tajik", "Tanzanian", "Thai", "Togolese", "Tunisian", "Turkish", "Turkmen", "Ugandan", "Ukrainian", "Uruguayan", "Uzbek", "Venezuelan", "Vietnamese", "Yemeni", "Zambian", "Zimbabwean", "Stateless (Bedoon)", "Other"];
const AC={nat:NATS,drug:Object.keys(DRUGS)};
// Thompson HIE score: 9 items, total 0-22 (mild 1-10, moderate 11-14, severe 15-22)
const THOMP_ROWS=[
 {k:"tone",l:"Tone",o:["","0 Normal","1 Hyper","2 Hypo","3 Flaccid"]},
 {k:"loc",l:"Level of consciousness",o:["","0 Normal","1 Hyperalert","2 Lethargic","3 Comatose"]},

 {k:"resp",l:"Respiration",o:["","0 Normal","1 Hyperventilation","2 Brief apnoea","3 IPPV (apnoea)"]},

 {k:"_tot",l:"Total (0–22)",calc:true}];

/* ---------- schema ---------- */
const F=(k,l,t,x={})=>Object.assign({k,l,t},x);
const H=(h,show)=>({h,show});
const R=(...row)=>({row});
const BG=["","A+","A−","B+","B−","AB+","AB−","O+","O−","Unknown"];
const SECTIONS=[

  R(F("name","Name","text",{g:2,mw:120}),F("mrn","ID","text",{g:1.3,mw:90}),F("sex","Sex","sel",{o:["","M","F","DSD"],mw:70})),
  H("Location & birth"),
  R(F("floor","Floor","sel",{o:["",...Object.keys(FLOORS)],g:.7,mw:64}),
    F("station","Station","sel",{o:b=>["",...(FLOORS[b.f.floor]||[])],g:.7,mw:64}),
    F("bedno","Bed","sel",{o:b=>[["","—"],...bedOpts(b.f.floor,b.f.station)],mw:84}),
    F("dob","Date of birth","date",{g:1.4,mw:130}),F("tob","Time of birth","tob",{g:1.6,mw:170})),
  H("Age"),

function mergeIn(d){
  const gone=Object.assign({},S.gone);Object.entries(d.gone||{}).forEach(([k,v])=>{if(!gone[k]||gone[k]<v)gone[k]=v});
  const m=new Map(S.babies.map(b=>[b.id,b]));let added=0,changed=0,removed=0;
  d.babies.forEach(x=>{const nb=fix(x),ob=m.get(nb.id);nb.u=nb.u||1;
    if(!ob){m.set(nb.id,nb);added++}else if(nb.u>(ob.u||0)){m.set(nb.id,nb);changed++}});
  for(const [id,b] of m)if(gone[id]&&gone[id]>=(b.u||0)){m.delete(id);if(S.babies.some(x=>x.id===id))removed++;else added--}
  S.babies=[...m.values()];S.gone=gone;

  out.querySelectorAll("[hidden]").forEach(x=>x.remove());
  const txt=el=>[...el.querySelectorAll(".v")].some(v=>v.textContent.trim()&&v.textContent!=="☐")||[...el.querySelectorAll(".calc")].some(x=>!x.classList.contains("empty"));
  out.querySelectorAll(".fld").forEach(f=>{if(!txt(f))f.remove()});
  out.querySelectorAll(".frow").forEach(r=>{if(!r.querySelector(".fld"))r.remove()});
  out.querySelectorAll(".row").forEach(r=>{if(!txt(r))r.remove()});
  out.querySelectorAll(".log li.empty,.auto li.empty").forEach(x=>x.remove());
  out.querySelectorAll("table.sheet tbody tr:not(.grp)").forEach(r=>{if(!txt(r))r.remove()});

  out.querySelectorAll(".tblwrap").forEach(w=>{if(!w.querySelector("tbody tr")){const p=w.previousElementSibling;if(p&&p.classList.contains("tblbar"))p.remove();w.remove()}});
  out.querySelectorAll(".log").forEach(l=>{if(!l.querySelector("li")){const p=l.previousElementSibling;if(p&&p.classList.contains("tblbar"))p.remove();l.remove()}});
  out.querySelectorAll(".auto").forEach(l=>{if(!l.querySelector("li")){const p=l.previousElementSibling;if(p&&p.classList.contains("tblbar"))p.remove();l.remove()}});
  out.querySelectorAll(".tblbar").forEach(t=>{const n=t.nextElementSibling;if(!n||n.classList.contains("tblbar")||n.tagName==="SECTION")t.remove()});
  out.querySelectorAll(".sub").forEach(h=>{let n=h.nextElementSibling,any=false;while(n&&!n.classList.contains("sub")){any=true;n=n.nextElementSibling}if(!any)h.remove()});
  out.querySelectorAll(".grid,.list").forEach(g=>{if(!g.children.length)g.remove()});
  out.querySelectorAll("section.card").forEach(sc=>{sc.classList.remove("folded");if(!sc.querySelector(".fld,.row,li,table"))sc.remove()});
  const b=cur(),wrap=document.createElement("div");wrap.id="printout";
  wrap.innerHTML=`<div class="ph"><b>${esc(b.f.name||"New baby")}${b.f.mrn?" · "+esc(b.f.mrn):""}</b><span>${esc(locFull(b))} · ${esc(S.date||"")} ${esc(S.shift||"")} · printed ${esc(fmtD(new Date()))}</span></div>`;
  wrap.appendChild(out);document.body.appendChild(wrap);
}

    logAdd(b,"rlog",x);
  }else if(k==="caff"){
    if(b.caffLast==="Yes"&&b.f.caff!=="Yes"){toPrev(b,"Caffeine citrate"+caffStr(b.f),b.f.caffs);save();b.caffLast=b.f.caff;render();toast("Caffeine moved to previous medications");return}
    if(b.f.caff==="Yes"&&!b.f.caffs){b.f.caffs=today();const el=$("#f_caffs");if(el)el.value=b.f.caffs}
    b.caffLast=b.f.caff;
  }else{
    const m=k.match(/^ino(\d)d?$/);if(!m)return;if(!inoChange(b,m[1]))return;
    save();render();return;
  }
  save();renderLogs(b);refresh();
});
/* ---------- password-locked sync file (AES-256-GCM, key from password via PBKDF2) ---------- */
const PWKEY="nicu-sync-pw", ITER=250000;
const b64=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const getPw=()=>{try{return localStorage.getItem(PWKEY)||""}catch(e){return""}};
const setPw=v=>{try{v?localStorage.setItem(PWKEY,v):localStorage.removeItem(PWKEY)}catch(e){}};
async function keyFrom(pw,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function lock(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFrom(pw,salt),new TextEncoder().encode(text));
  return JSON.stringify({nicuLocked:1,iter:ITER,salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function unlock(d,pw){
  const key=await keyFrom(pw,unb64(d.salt));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(d.iv)},key,unb64(d.data)); // throws on wrong password
  return JSON.parse(new TextDecoder().decode(pt));
}
// small password dialog; resolves {pw,remember} or null
function askPw({title,text,confirm,okLabel}){
  return new Promise(res=>{
    const ov=document.createElement("div");ov.className="pwdlg";
    const saved=!!getPw();
    ov.innerHTML=`<form role="dialog" aria-modal="true" aria-label="${esc(title)}"><b>${esc(title)}</b><p>${text}</p>
      <input class="inp" type="password" id="pw1" autocomplete="off" placeholder="Sync password" minlength="6" required>
      ${confirm?`<input class="inp" type="password" id="pw2" autocomplete="off" placeholder="Repeat password" required>`:""}
      <label class="rem"><input type="checkbox" id="pwrem" checked> Remember on this device</label>
      <span class="err" id="pwerr"></span>
      <div class="btns"><button type="button" class="btn ghost" data-pwx>Cancel</button><button class="btn" type="submit">${okLabel||"OK"}</button></div></form>`;
    document.body.appendChild(ov);const f=ov.querySelector("form"),done=v=>{ov.remove();res(v)};
    ov.querySelector("[data-pwx]").onclick=()=>done(null);
    f.onsubmit=e=>{e.preventDefault();const a=f.querySelector("#pw1").value,c=f.querySelector("#pw2");
      if(a.length<6)return f.querySelector("#pwerr").textContent="At least 6 characters";
      if(c&&c.value!==a)return f.querySelector("#pwerr").textContent="Passwords do not match";
      done({pw:a,remember:f.querySelector("#pwrem").checked})};
    setTimeout(()=>f.querySelector("#pw1").focus(),50);
  });
}
// last-resort share step that needs a fresh tap (iPad Safari only shares straight after a tap)
function shareStep(file,blob,name){
  const ov=document.createElement("div");ov.className="pwdlg";
  ov.innerHTML=`<form><b>File locked and ready</b><p>Tap Share and choose AirDrop.</p><div class="btns"><button type="button" class="btn ghost" data-x>Cancel</button><button type="button" class="btn" data-s>Share</button></div></form>`;
  document.body.appendChild(ov);
  ov.querySelector("[data-x]").onclick=()=>ov.remove();
  ov.querySelector("[data-s]").onclick=async()=>{ov.remove();try{await navigator.share({files:[file],title:"NICU duty sync"})}catch(e){if(!e||e.name!=="AbortError")download(blob,name)}};
}
function download(blob,name){const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function backup(){
  if(!window.crypto||!crypto.subtle)return toast("Locking needs the app opened from its https link");
  let pw=getPw();
  if(!pw){const r=await askPw({title:"Set a sync password",text:"The file is locked with this password. Use the same password on your other device to open it. If you forget it, the file cannot be opened.",confirm:true,okLabel:"Lock & send"});
    if(!r)return;pw=r.pw;if(r.remember)setPw(pw)}
  toast("Locking…");
  const n=new Date(),name="nicu-duty-"+todayISO()+"-"+pad(n.getHours())+pad(n.getMinutes())+"-locked.json";
  const blob=new Blob([await lock(JSON.stringify(S),pw)],{type:"application/json"}),file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"NICU duty sync"});return}
    catch(e){if(e&&e.name==="AbortError")return;return shareStep(file,blob,name)}}
  download(blob,name);toast("Locked file saved");
}
async function receive(file){
  if(!file)return;
  let d;try{d=JSON.parse(await file.text())}catch(e){return toast("That file is not a NICU duty file")}
  if(d&&d.nicuLocked){
    if(!window.crypto||!crypto.subtle)return toast("Unlocking needs the app opened from its https link");
    let out=null,pw=getPw();
    if(pw){try{out=await unlock(d,pw)}catch(e){}}
    while(!out){
      const r=await askPw({title:"Enter sync password",text:pw?"The saved password did not open this file. Enter the password used on the sending device.":"This file is locked. Enter the password used on the sending device.",okLabel:"Unlock"});
      if(!r)return;
      try{out=await unlock(d,r.pw);if(r.remember)setPw(r.pw)}catch(e){toast("Wrong password");pw=r.pw}
    }
    d=out;
  }
  if(!d||!Array.isArray(d.babies))return toast("That file is not a NICU duty file");
  const r=mergeIn(d);if(!S.babies.some(b=>b.id===S.cur))S.cur=visible()[0]?.id;
  save();render();
  const parts=[r.added&&r.added+" new",r.changed&&r.changed+" updated",r.removed&&r.removed+" removed"].filter(Boolean);
  toast(parts.length?"Synced: "+parts.join(", "):"Already up to date");
}
document.addEventListener("change",e=>{if(e.target.id!=="restoreIn")return;receive(e.target.files[0]);e.target.value=""});
// Mac: drag the received file onto the page
document.addEventListener("dragover",e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))e.preventDefault()});
document.addEventListener("drop",e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f){e.preventDefault();receive(f)}});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.wadd){e.preventDefault();addWP(e.target.dataset.wadd)}});
function addWP(id){const b=byId(id),inp=$("#wpb_"+id),tm=$("#wpt_"+id);if(!inp.value.trim())return;b.todos.push({a:tm.value.trim(),b:inp.value.trim(),x:false});save();render();$("#wpb_"+id)?.focus()}
let armTimer;
function arm(el,msg){if(el.classList.contains("arm"))return true;el.classList.add("arm");clearTimeout(armTimer);armTimer=setTimeout(()=>el.classList.remove("arm"),3000);toast(msg);return false}
document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;
  if(el.dataset.pick){S.view=null;S.cur=el.dataset.pick;save();render();window.scrollTo(0,0);return}
  if(el.dataset.wp){S.view=el.dataset.wp;save();render();window.scrollTo(0,0);return}
  if(el.dataset.waddb)return addWP(el.dataset.waddb);
  if(el.dataset.fam){const fb=byId(el.dataset.fam);fb.f.family=(fb.f.family?fb.f.family.trim()+"\n":"")+stamp()+" parents updated";save();render();toast("Parents update recorded");return}
  if(el.dataset.fold){const k=el.dataset.fold;S.fold[k]=!S.fold[k];save();el.setAttribute("aria-expanded",!S.fold[k]);el.closest("section").classList.toggle("folded",!!S.fold[k]);return}
  const a=el.dataset.act;
  if(a==="backup")return backup();
  if(a==="pwchange"){askPw({title:"New sync password",text:"Use the same password on your other device.",confirm:true,okLabel:"Save"}).then(r=>{if(r){setPw(r.remember?r.pw:"");toast(r.remember?"Sync password saved":"Password not saved – you will be asked each time")}});return}
  if(a==="pwforget"){setPw("");toast("Password forgotten – you will be asked next time");return}
  if(a==="foldall"||a==="openall"){FOLDKEYS.forEach(k=>S.fold[k]=a==="foldall");save();render();return}
  if(a==="print"){printPrep();window.print();return}
  if(a==="addbaby"){const nb=blank();S.babies.push(nb);S.cur=nb.id;S.view=null;save();render();window.scrollTo(0,0);$("#f_name")?.focus();return}
  if(a==="copywp"){const [fl,st]=S.view.split("|");return copy(`WORK PLAN – ${fl} ${st} – ${S.date||""} ${S.shift||""}\n\n`+visible().filter(b=>b.f.floor===fl&&b.f.station===st).map(wpText).join("\n\n"))}
  const b=cur();if(!b||S.view)return;
  if(el.dataset.dc){const i=el.dataset.dc;b.f["ino"+i]="";b.f["ino"+i+"d"]="";inoChange(b,i);save();render();toast("DC recorded · moved to previous medications");return}
  if(el.dataset.sev){b.f.status=el.dataset.sev;save();document.querySelectorAll("[data-sev]").forEach(x=>x.setAttribute("aria-pressed",x===el));refresh();renderBeds();return}
  if(el.dataset.addcol){const k=el.dataset.addcol;b[k].push(newCol(k));save();render();
    const w=document.querySelector(`[data-addcol="${k}"]`).closest(".tblbar").nextElementSibling;w.scrollLeft=w.scrollWidth;
    const ins=w.querySelectorAll(`[data-c="${b[k].length-1}"]`);(ins[k==="gases"?3:1]||ins[0])?.focus();return}
  if(el.dataset.delcol){if(!arm(el,"Tap × again to delete this column"))return;b[el.dataset.delcol].splice(+el.dataset.i,1);save();render();return}
  if(el.dataset.delrow){if(!arm(el,"Tap × again to delete this test"))return;const id=el.dataset.delrow;b.invx=b.invx.filter(x=>x.id!==id);b.inv.forEach(c=>delete c["x_"+id]);save();render();return}
  if(a==="addtest"){const x={id:uid(),name:""};b.invx.push(x);save();render();$(`[data-xname="${x.id}"]`)?.focus();return}
  if(el.dataset.stop){const k=el.dataset.stop,it=b[k][+el.dataset.i];toPrev(b,medLabel(it),it.d);b[k].splice(+el.dataset.i,1);save();render();toast("Moved to previous medications");return}
  if(el.dataset.add){const k=el.dataset.add;b[k].push(k==="todos"?{a:"",b:"",x:false}:k==="prev"?{a:"",d:"",e:today()}:(k==="img"||k==="cons")?{t:"",d:today(),a:""}:k==="growth"?{d:today(),w:"",l:"",h:""}:{a:"",d:today()});save();render();
    const rows=document.querySelectorAll(`[data-l="${k}"][data-p="${k==="todos"?"b":(k==="img"||k==="cons")?"t":"a"}"]`);rows[rows.length-1]?.focus();return}
  if(el.dataset.del){b[el.dataset.del].splice(+el.dataset.i,1);save();if(/log$/.test(el.dataset.del)){renderLogs(b);refresh()}else render();return}
  if(a==="copysec"){const k=el.dataset.sec,o=sbarParse(handover(b));return copy(o.head+"\n"+SBARHEAD[k]+"\n"+o[k].join("\n"))}
  if(a==="copy1")return copy(handover(b));
  if(a==="copyall")return copy(`NICU SBAR handover – ${S.floor||"all floors"} – ${S.date||""} ${S.shift||""}\n\n`+visible().map(handover).join("\n\n————————\n\n"));
  if(a==="delbaby"){
    if(!el.classList.contains("arm")){el.classList.add("arm");el.textContent="Tap again to delete";clearTimeout(armTimer);
      armTimer=setTimeout(()=>{el.classList.remove("arm");el.textContent="Delete this baby"},3500);return}
    S.gone[b.id]=Date.now();S.babies=S.babies.filter(x=>x.id!==b.id);S.cur=visible()[0]?.id;save();render();toast("Deleted");
  }
});
$("#shiftDate").value=S.date||todayISO();$("#shiftType").value=S.shift||"Night";$("#floorFilter").value=S.floor||"";
const markDate=()=>{const el=$("#shiftDate"),p=!!S.date&&S.date!==todayISO();el.classList.toggle("past",p);el.title=p?"Not today: new entries will be dated "+S.date.split("-").reverse().join("/"):"Today"};
$("#shiftDate").addEventListener("input",e=>{S.date=e.target.value;save();markDate();render();if(S.date&&S.date!==todayISO())toast("New entries will be dated "+S.date.split("-").reverse().slice(0,2).join("/"))});
markDate();
$("#shiftType").addEventListener("input",e=>{S.shift=e.target.value;save();if(S.view)render()});
$("#floorFilter").addEventListener("input",e=>{S.floor=e.target.value;S.cur=visible()[0]?.id;save();render()});
save();render();
})();
